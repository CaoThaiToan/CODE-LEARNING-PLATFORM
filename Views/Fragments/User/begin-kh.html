<div class="lesson-layout">

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="back-btn" data-page="chi-tiet-kh.html">
                <i class="fas fa-chevron-left"></i>
                <span>TRỞ VỀ KHÓA HỌC</span>
            </a>
        </div>

        <div class="course-info">
            <h3 class="course-title" id="sidebar-course-title">Đang tải...</h3>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 0%" id="sidebar-progress-fill"></div>
            </div>
            <p class="progress-text" id="sidebar-progress-text">Hoàn thành 0/0 bài học (0%)</p>
        </div>

        <div class="lesson-list-scroll">
            <ul class="lesson-list" id="sidebar-lesson-list">
                <li style="padding: 20px; color: #a8b2d1; text-align: center;">Đang tải danh sách bài học...</li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <button class="close-btn" data-page="chi-tiet-kh.html"><i class="fas fa-times"></i></button>
            <h2 class="topbar-title" id="topbar-lesson-title">Đang tải...</h2>
            <a href="#" class="qa-btn"><i class="far fa-comment-dots"></i> Hỏi đáp</a>
        </div>

        <div class="content-scroll" id="main-lesson-content">
            <div style="padding: 100px; text-align: center; color: #a8b2d1;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 15px;"></i>
                <p>Đang tải nội dung bài học...</p>
            </div>
        </div>
    </main>
</div>

<script>
(async function initBeginKH() {
    const courseId = window.selectedCourseId;
    if (!courseId) {
        document.getElementById('main-lesson-content').innerHTML = `
            <div style="padding: 100px; text-align: center; color: #ef4444;">
                <h3>⚠️ Lỗi: Không tìm thấy khóa học.</h3>
                <button onclick="window.loadPage('trang-chu.html')" style="margin-top:20px; padding:10px 20px; background:#6d28d9; color:white; border:none; border-radius:8px; cursor:pointer;">Về trang chủ</button>
            </div>`;
        return;
    }

    let lessons = [];
    let currentLessonIndex = 0;
    let currentLessonDetail = null;

    try {
        // Fetch course info (optional, just to get title)
        const course = await window.getCourseById(courseId);
        if (course) {
            document.getElementById('sidebar-course-title').textContent = course.title.toUpperCase();
        }

        // Fetch lessons list
        lessons = await window.getLessonsByCourse(courseId);
        
        if (lessons.length === 0) {
            document.getElementById('sidebar-lesson-list').innerHTML = '<li style="padding: 20px; color: #a8b2d1; text-align: center;">Chưa có bài học nào.</li>';
            document.getElementById('main-lesson-content').innerHTML = `
                <div style="padding: 100px; text-align: center; color: #a8b2d1;">
                    <h3>Khoá học này chưa có nội dung.</h3>
                </div>`;
            return;
        }

        // Init Sidebar
        renderSidebar();

        // Load first lesson
        await loadLesson(0);

    } catch (err) {
        console.error('Lỗi load khóa học:', err);
        document.getElementById('main-lesson-content').innerHTML = `<div style="padding: 50px; text-align: center; color: #ef4444;">Lỗi khi tải dữ liệu bài học.</div>`;
    }

    function renderSidebar() {
        const listContainer = document.getElementById('sidebar-lesson-list');
        listContainer.innerHTML = '';
        
        document.getElementById('sidebar-progress-text').textContent = `Hoàn thành 0/${lessons.length} bài học (0%)`;

        lessons.forEach((lesson, index) => {
            const li = document.createElement('li');
            li.className = `lesson-item ${index === currentLessonIndex ? 'active' : ''}`;
            li.innerHTML = `
                <div class="lesson-icon"><i class="fas fa-play"></i></div>
                <div class="lesson-info">
                    <span class="lesson-name">${index + 1}. ${lesson.title}</span>
                </div>
            `;
            li.addEventListener('click', () => loadLesson(index));
            listContainer.appendChild(li);
        });
    }

    async function loadLesson(index) {
        if (index < 0 || index >= lessons.length) return;
        currentLessonIndex = index;
        const lessonMeta = lessons[index];

        // Update sidebar visual active state
        document.querySelectorAll('.lesson-item').forEach((li, i) => {
            li.classList.toggle('active', i === index);
        });

        document.getElementById('topbar-lesson-title').textContent = lessonMeta.title.toUpperCase();
        
        const mainContent = document.getElementById('main-lesson-content');
        mainContent.innerHTML = `<div style="padding: 50px; text-align: center; color: #a8b2d1;"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div>`;

        try {
            const lessonData = await window.getLessonById(lessonMeta.id);
            if (!lessonData) throw new Error('Không có data');
            currentLessonDetail = lessonData;
            renderMainContent(lessonData);
        } catch (e) {
            console.error(e);
            mainContent.innerHTML = `<div style="padding: 50px; text-align: center; color: #ef4444;">Lỗi tải chi tiết bài học.</div>`;
        }
    }

    function renderMainContent(lesson) {
        let videoHtml = '';
        if (lesson.video_url) {
            // Very simple YouTube embed extraction for demo purposes
            let embedUrl = lesson.video_url;
            if (embedUrl.includes('watch?v=')) {
                embedUrl = embedUrl.replace('watch?v=', 'embed/');
            }
            videoHtml = `
                <div class="video-wrapper">
                    <iframe width="100%" height="500" src="${embedUrl}" frameborder="0" allowfullscreen style="border-radius: 12px;"></iframe>
                </div>
            `;
        } else {
            videoHtml = `
                <div class="video-wrapper" style="display:flex;align-items:center;justify-content:center;background:#1e293b;height:300px;border-radius:12px;">
                    <h3 style="color:#94a3b8;"><i class="fa-solid fa-book-open"></i> Bài học lý thuyết</h3>
                </div>
            `;
        }

        let theoryHtml = lesson.theory_md ? `<div class="lesson-body" style="white-space: pre-wrap; line-height: 1.6; color: #e2e8f0;">${lesson.theory_md}</div>` : '';

        let quizHtml = '';
        if (lesson.quizzes && lesson.quizzes.length > 0) {
            let questionsHtml = lesson.quizzes.map((quiz, qIdx) => {
                let optionsHtml = (quiz.options || []).map((opt, oIdx) => {
                    return `
                        <label style="display:block; margin: 8px 0; cursor:pointer;">
                            <input type="radio" name="q${qIdx}" value="${opt.id}" data-correct="${opt.is_correct}"> 
                            ${opt.option_text}
                        </label>
                    `;
                }).join('');

                return `
                    <div class="quiz-question" style="margin-bottom: 25px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 8px;">
                        <p style="margin-bottom: 12px;"><strong>Câu ${qIdx + 1}: ${quiz.question_text}</strong></p>
                        ${optionsHtml}
                    </div>
                `;
            }).join('');

            quizHtml = `
                <div class="quiz-section">
                    <h3 class="quiz-section-title">📝 Kiểm tra kiến thức</h3>
                    ${questionsHtml}
                    <div class="quiz-actions" style="margin-top: 20px;">
                        <button id="btn-submit-quiz" class="btn-quiz btn-quiz-primary"><i class="fas fa-paper-plane"></i> Kiểm tra kết quả</button>
                    </div>
                    <div id="quiz-result" class="quiz-result-box" style="display:none; margin-top: 20px;"></div>
                </div>
            `;
        }

        const prevDisabled = currentLessonIndex === 0 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : '';
        const nextDisabled = currentLessonIndex === lessons.length - 1 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : '';

        document.getElementById('main-lesson-content').innerHTML = `
            ${videoHtml}
            <div class="lesson-detail">
                <div class="lesson-detail-header">
                    <h1 class="lesson-detail-title" style="margin: 20px 0;">${lesson.title}</h1>
                </div>
                ${theoryHtml}
                ${quizHtml}
            </div>
            <div class="lesson-nav" style="margin-top: 40px; display:flex; justify-content:space-between;">
                <button id="btn-prev-lesson" class="nav-btn nav-prev" ${prevDisabled}><i class="fas fa-chevron-left"></i> Bài trước</button>
                <button id="btn-next-lesson" class="nav-btn nav-next" ${nextDisabled}>Bài tiếp theo <i class="fas fa-chevron-right"></i></button>
            </div>
        `;

        if (lesson.quizzes && lesson.quizzes.length > 0) {
            document.getElementById('btn-submit-quiz').addEventListener('click', () => submitDynamicQuiz(lesson.quizzes));
        }

        document.getElementById('btn-prev-lesson').addEventListener('click', () => loadLesson(currentLessonIndex - 1));
        document.getElementById('btn-next-lesson').addEventListener('click', () => loadLesson(currentLessonIndex + 1));
    }

    async function submitDynamicQuiz(quizzes) {
        const answers = [];
        quizzes.forEach((quiz, qIdx) => {
            const selected = document.querySelector(`input[name="q${qIdx}"]:checked`);
            if (selected) {
                answers.push({
                    quiz_id: quiz.id,
                    selected_option_id: parseInt(selected.value)
                });
            }
        });

        if (answers.length < quizzes.length) {
            if (!confirm('Bạn chưa trả lời hết các câu hỏi. Vẫn muốn nộp bài?')) return;
        }

        const btn = document.getElementById('btn-submit-quiz');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang chấm điểm...';

        try {
            const token = localStorage.getItem('token');
            const res = await fetch('http://localhost:3000/api/quizzes/submit', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ lesson_id: currentLessonDetail.id, answers })
            });

            const data = await res.json();
            if (data.success) {
                renderQuizResults(data, quizzes);
            } else {
                alert('Lỗi: ' + data.message);
            }
        } catch (err) {
            console.error(err);
            alert('Lỗi kết nối khi chấm điểm.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kiểm tra kết quả';
        }
    }

    function renderQuizResults(data, quizzes) {
        const resultDiv = document.getElementById('quiz-result');
        resultDiv.style.display = 'block';
        
        let feedbackHTML = '<div class="feedback-list" style="margin-top:15px;">';
        
        quizzes.forEach((quiz, qIdx) => {
            const res = data.results.find(r => r.quiz_id === quiz.id);
            if (res && res.is_correct) {
                feedbackHTML += `<div style="color:#22c55e; margin-bottom:10px;"><i class="fas fa-check-circle"></i> Câu ${qIdx + 1}: Chính xác</div>`;
            } else {
                const correctOpt = quiz.options.find(o => o.id === (res ? res.correct_option_id : null));
                const correctText = correctOpt ? correctOpt.option_text : 'Chưa rõ';
                feedbackHTML += `<div style="color:#ef4444; margin-bottom:10px;"><i class="fas fa-times-circle"></i> Câu ${qIdx + 1}: Sai. Đáp án đúng là: ${correctText}</div>`;
            }
        });
        
        feedbackHTML += '</div>';

        resultDiv.innerHTML = `
            <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
                <div style="font-size:24px; font-weight:bold; color: ${data.percent === 100 ? '#22c55e' : '#eab308'};">
                    Kết quả: ${data.percent}% (${data.score}/${data.total})
                </div>
                ${feedbackHTML}
            </div>
        `;
        
        // Scroll to result
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

})();
</script>
