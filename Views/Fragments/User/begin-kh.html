<div class="lesson-layout">

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="back-btn" data-page="chi-tiet-kh.html">
                <i class="fas fa-chevron-left"></i>
                <span>TRỞ VỀ KHÓA HỌC</span>
            </a>
        </div>

        <div class="course-info">
            <h3 class="course-title" id="sidebar-course-title">Đang tải...</h3>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 0%" id="sidebar-progress-fill"></div>
            </div>
            <p class="progress-text" id="sidebar-progress-text">Hoàn thành 0/0 bài học (0%)</p>
        </div>

        <div class="lesson-list-scroll">
            <ul class="lesson-list" id="sidebar-lesson-list">
                <li style="padding: 20px; color: #a8b2d1; text-align: center;">Đang tải danh sách bài học...</li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <button class="close-btn" data-page="chi-tiet-kh.html"><i class="fas fa-times"></i></button>
            <h2 class="topbar-title" id="topbar-lesson-title">Đang tải...</h2>
            <a href="#" class="qa-btn"><i class="far fa-comment-dots"></i> Hỏi đáp</a>
        </div>

        <div class="content-scroll" id="main-lesson-content">
            <div style="padding: 100px; text-align: center; color: #a8b2d1;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 15px;"></i>
                <p>Đang tải nội dung bài học...</p>
            </div>
        </div>
    </main>
</div>

<script>
(async function initBeginKH() {
    const courseId = window.selectedCourseId;
    if (!courseId) {
        document.getElementById('main-lesson-content').innerHTML = `
            <div style="padding: 100px; text-align: center; color: #ef4444;">
                <h3>⚠️ Lỗi: Không tìm thấy khóa học.</h3>
                <button onclick="window.loadPage('trang-chu.html')" style="margin-top:20px; padding:10px 20px; background:#6d28d9; color:white; border:none; border-radius:8px; cursor:pointer;">Về trang chủ</button>
            </div>`;
        return;
    }

    let lessons = [];
    let currentLessonIndex = 0;
    let completedLessonIds = [];
    let isVip = false;

    try {
        // Fetch course info (optional, just to get title)
        const course = await window.getCourseById(courseId);
        if (course) {
            document.getElementById('sidebar-course-title').textContent = course.title.toUpperCase();
            isVip = Number(course.price) > 0;
        }

        // Fetch lessons list
        lessons = await window.getLessonsByCourse(courseId);
        
        if (lessons.length === 0) {
            document.getElementById('sidebar-lesson-list').innerHTML = '<li style="padding: 20px; color: #a8b2d1; text-align: center;">Chưa có bài học nào.</li>';
            document.getElementById('main-lesson-content').innerHTML = `
                <div style="padding: 100px; text-align: center; color: #a8b2d1;">
                    <h3>Khoá học này chưa có nội dung.</h3>
                </div>`;
            return;
        }

        // Fetch user progress
        await fetchProgress();

        // Init Sidebar
        renderSidebar();

        // Load first lesson
        await loadLesson(0);

    } catch (err) {
        console.error('Lỗi load khóa học:', err);
        document.getElementById('main-lesson-content').innerHTML = `<div style="padding: 50px; text-align: center; color: #ef4444;">Lỗi khi tải dữ liệu bài học.</div>`;
    }

    async function fetchProgress() {
        try {
            const token = localStorage.getItem('token');
            const res = await fetch(`http://localhost:3000/api/users/progress/${courseId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) {
                completedLessonIds = data.data || [];
                updateProgressBar();
            }
        } catch (err) {
            console.error('Lỗi tải tiến độ:', err);
        }
    }

    function updateProgressBar() {
        if (lessons.length === 0) return;
        const percent = Math.round((completedLessonIds.length / lessons.length) * 100);
        document.getElementById('sidebar-progress-fill').style.width = `${percent}%`;
        document.getElementById('sidebar-progress-text').textContent = `Hoàn thành ${completedLessonIds.length}/${lessons.length} bài học (${percent}%)`;
    }

    function renderSidebar() {
        const listContainer = document.getElementById('sidebar-lesson-list');
        listContainer.innerHTML = '';
        
        updateProgressBar();

        lessons.forEach((lesson, index) => {
            const isCompleted = completedLessonIds.includes(lesson.id);
            const li = document.createElement('li');
            li.className = `lesson-item ${index === currentLessonIndex ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
            
            const icon = isCompleted ? '<i class="fas fa-check-circle" style="color: #22c55e;"></i>' : '<i class="fas fa-play"></i>';
            
            li.innerHTML = `
                <div class="lesson-icon">${icon}</div>
                <div class="lesson-info">
                    <span class="lesson-name">${index + 1}. ${lesson.title}</span>
                </div>
            `;
            li.addEventListener('click', () => loadLesson(index));
            listContainer.appendChild(li);
        });
    }

    async function loadLesson(index) {
        if (index < 0 || index >= lessons.length) return;
        currentLessonIndex = index;
        const lessonMeta = lessons[index];

        // Update sidebar visual active state
        document.querySelectorAll('.lesson-item').forEach((li, i) => {
            li.classList.toggle('active', i === index);
        });

        document.getElementById('topbar-lesson-title').textContent = lessonMeta.title.toUpperCase();
        
        const mainContent = document.getElementById('main-lesson-content');
        mainContent.innerHTML = `<div style="padding: 50px; text-align: center; color: #a8b2d1;"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div>`;

        try {
            const lessonData = await window.getLessonById(lessonMeta.id);
            if (!lessonData) throw new Error('Không có data');
            currentLessonDetail = lessonData;
            renderMainContent(lessonData);
        } catch (e) {
            console.error(e);
            mainContent.innerHTML = `<div style="padding: 50px; text-align: center; color: #ef4444;">Lỗi tải chi tiết bài học.</div>`;
        }
    }

    function renderMainContent(lesson) {
        let videoHtml = '';
        if (lesson.video_url) {
            // Very simple YouTube embed extraction for demo purposes
            let embedUrl = lesson.video_url;
            if (embedUrl.includes('watch?v=')) {
                embedUrl = embedUrl.replace('watch?v=', 'embed/');
            }
            videoHtml = `
                <div class="video-wrapper">
                    <iframe width="100%" height="500" src="${embedUrl}" frameborder="0" allowfullscreen style="border-radius: 12px;"></iframe>
                </div>
            `;
        } else {
            videoHtml = `
                <div class="video-wrapper" style="display:flex;align-items:center;justify-content:center;background:#1e293b;height:300px;border-radius:12px;">
                    <h3 style="color:#94a3b8;"><i class="fa-solid fa-book-open"></i> Bài học lý thuyết</h3>
                </div>
            `;
        }

        const actionsHtml = `
            <div class="course-action-buttons" style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 15px; margin-bottom: 15px; padding-right: 5px;">
                <button id="btn-toggle-comments" class="action-btn" style="background: rgba(124, 58, 237, 0.12); color: #c084fc; border: 1px solid rgba(124, 58, 237, 0.35); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;" onmouseover="this.style.background='rgba(124, 58, 237, 0.25)'; this.style.boxShadow='0 0 12px rgba(124, 58, 237, 0.25)'" onmouseout="this.style.background='rgba(124, 58, 237, 0.12)'; this.style.boxShadow='none'">
                    <i class="fa-solid fa-comments"></i> Bình luận
                </button>
                ${!isVip ? `
                <button id="btn-share-course" class="action-btn" style="background: rgba(255, 255, 255, 0.05); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;" onmouseover="this.style.background='rgba(255, 255, 255, 0.1)'; this.style.borderColor='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255, 255, 255, 0.05)'; this.style.borderColor='rgba(255,255,255,0.15)'">
                    <i class="fa-solid fa-share-nodes"></i> Chia sẻ
                </button>
                ` : ''}
            </div>
        `;

        let theoryHtml = lesson.theory_md ? `<div class="lesson-body" style="white-space: pre-wrap; line-height: 1.6; color: #e2e8f0;">${lesson.theory_md}</div>` : '';

        let quizHtml = '';
        if (lesson.quizzes && lesson.quizzes.length > 0) {
            let questionsHtml = lesson.quizzes.map((quiz, qIdx) => {
                let optionsHtml = (quiz.options || []).map((opt, oIdx) => {
                    return `
                        <label style="display:block; margin: 8px 0; cursor:pointer;">
                            <input type="radio" name="q${qIdx}" value="${opt.id}" data-correct="${opt.is_correct}"> 
                            ${opt.option_text}
                        </label>
                    `;
                }).join('');

                return `
                    <div class="quiz-question" style="margin-bottom: 25px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 8px;">
                        <p style="margin-bottom: 12px;"><strong>Câu ${qIdx + 1}: ${quiz.question_text}</strong></p>
                        ${optionsHtml}
                    </div>
                `;
            }).join('');

            quizHtml = `
                <div class="quiz-section">
                    <h3 class="quiz-section-title">📝 Kiểm tra kiến thức</h3>
                    ${questionsHtml}
                    <div class="quiz-actions" style="margin-top: 20px;">
                        <button id="btn-submit-quiz" class="btn-quiz btn-quiz-primary"><i class="fas fa-paper-plane"></i> Kiểm tra kết quả</button>
                    </div>
                    <div id="quiz-result" class="quiz-result-box" style="display:none; margin-top: 20px;"></div>
                </div>
            `;
        }

        const prevDisabled = currentLessonIndex === 0 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : '';
        const nextDisabled = currentLessonIndex === lessons.length - 1 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : '';

        // Nút đánh dấu hoàn thành cho bài học không có bài kiểm tra
        let completeBtnHtml = '';
        const isCompleted = completedLessonIds.includes(lesson.id);
        if (!lesson.quizzes || lesson.quizzes.length === 0) {
            if (isCompleted) {
                completeBtnHtml = `<button class="nav-btn" disabled style="opacity:0.8; background:#22c55e; color:white;"><i class="fas fa-check"></i> Đã hoàn thành</button>`;
            } else {
                completeBtnHtml = `<button id="btn-mark-complete" class="nav-btn" style="background:#3b82f6; color:white;"><i class="fas fa-check"></i> Đánh dấu hoàn thành</button>`;
            }
        }

        document.getElementById('main-lesson-content').innerHTML = `
            ${videoHtml}
            ${actionsHtml}
            <div class="lesson-detail">
                <div class="lesson-detail-header">
                    <h1 class="lesson-detail-title" style="margin: 20px 0;">${lesson.title}</h1>
                </div>
                ${theoryHtml}
                ${quizHtml}
                
                <!-- Khu vực bình luận khóa học -->
                <div id="course-comments-section" style="display: none; margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px;">
                    <h3 style="color: #f8fafc; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-size: 1.25rem;">
                        <i class="fa-solid fa-comments" style="color: #c084fc;"></i> Ý kiến học viên về khóa học
                    </h3>
                    
                    <!-- Khung nhập bình luận -->
                    <div class="comment-form" style="background: rgba(255,255,255,0.02); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px;">
                        <textarea id="comment-input" placeholder="Nhập ý kiến hoặc câu hỏi của bạn về khóa học..." style="width: 100%; height: 100px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; color: #f8fafc; font-family: inherit; font-size: 14px; resize: none; margin-bottom: 12px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#a78bfa'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'"></textarea>
                        <div style="display: flex; justify-content: flex-end;">
                            <button id="btn-submit-comment" style="background: #7c3aed; color: #fff; border: none; padding: 10px 22px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s;" onmouseover="this.style.background='#6d28d9'" onmouseout="this.style.background='#7c3aed'">
                                <i class="fa-solid fa-paper-plane"></i> Gửi ý kiến
                            </button>
                        </div>
                    </div>

                    <!-- Danh sách bình luận -->
                    <div id="comments-list" style="display: flex; flex-direction: column; gap: 15px; max-height: 500px; overflow-y: auto; padding-right: 5px;">
                        <!-- Động tải dữ liệu -->
                    </div>
                </div>
            </div>
            <div class="lesson-nav" style="margin-top: 40px; display:flex; justify-content:space-between; align-items:center;">
                <button id="btn-prev-lesson" class="nav-btn nav-prev" ${prevDisabled}><i class="fas fa-chevron-left"></i> Bài trước</button>
                ${completeBtnHtml}
                <button id="btn-next-lesson" class="nav-btn nav-next" ${nextDisabled}>Bài tiếp theo <i class="fas fa-chevron-right"></i></button>
            </div>
        `;

        if (lesson.quizzes && lesson.quizzes.length > 0) {
            document.getElementById('btn-submit-quiz').addEventListener('click', () => submitDynamicQuiz(lesson.quizzes));
        } else if (!isCompleted) {
            const markBtn = document.getElementById('btn-mark-complete');
            if (markBtn) {
                markBtn.addEventListener('click', async () => {
                    markBtn.disabled = true;
                    const originalHtml = markBtn.innerHTML;
                    markBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
                    
                    const success = await markLessonComplete(lesson.id);
                    if (success) {
                        markBtn.style.background = '#22c55e';
                        markBtn.innerHTML = '<i class="fas fa-check"></i> Đã hoàn thành';
                    } else {
                        markBtn.disabled = false;
                        markBtn.innerHTML = originalHtml;
                        alert('Không thể đánh dấu hoàn thành. Vui lòng kiểm tra kết nối!');
                    }
                });
            }
        }

        // Xử lý sự kiện bình luận & chia sẻ
        const toggleBtn = document.getElementById('btn-toggle-comments');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const section = document.getElementById('course-comments-section');
                if (section) {
                    const isHidden = section.style.display === 'none';
                    section.style.display = isHidden ? 'block' : 'none';
                    if (isHidden) {
                        loadCourseComments();
                        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            });
        }
        
        const shareBtn = document.getElementById('btn-share-course');
        if (shareBtn) {
            shareBtn.addEventListener('click', shareCourse);
        }
        
        const submitCommentBtn = document.getElementById('btn-submit-comment');
        if (submitCommentBtn) {
            submitCommentBtn.addEventListener('click', submitCourseComment);
        }

        document.getElementById('btn-prev-lesson').addEventListener('click', () => loadLesson(currentLessonIndex - 1));
        document.getElementById('btn-next-lesson').addEventListener('click', async () => {
            // Tự động đánh dấu hoàn thành nếu học viên bấm "Bài tiếp theo" và bài này không có Quiz
            if (!isCompleted && (!lesson.quizzes || lesson.quizzes.length === 0)) {
                await markLessonComplete(lesson.id);
            }
            loadLesson(currentLessonIndex + 1);
        });
    }

    async function submitDynamicQuiz(quizzes) {
        const answers = [];
        quizzes.forEach((quiz, qIdx) => {
            const selected = document.querySelector(`input[name="q${qIdx}"]:checked`);
            if (selected) {
                answers.push({
                    quiz_id: quiz.id,
                    selected_option_id: parseInt(selected.value)
                });
            }
        });

        if (answers.length < quizzes.length) {
            if (!confirm('Bạn chưa trả lời hết các câu hỏi. Vẫn muốn nộp bài?')) return;
        }

        const btn = document.getElementById('btn-submit-quiz');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang chấm điểm...';

        try {
            const token = localStorage.getItem('token');
            const res = await fetch('http://localhost:3000/api/quizzes/submit', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ lesson_id: currentLessonDetail.id, answers })
            });

            const data = await res.json();
            if (data.success) {
                renderQuizResults(data, quizzes);
                
                // Nếu điểm đạt >= 50% (hoặc tuỳ logic), đánh dấu bài học hoàn thành
                if (data.percent >= 50) {
                    await markLessonComplete(currentLessonDetail.id);
                }
            } else {
                alert('Lỗi: ' + data.message);
            }
        } catch (err) {
            console.error(err);
            alert('Lỗi kết nối khi chấm điểm.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kiểm tra kết quả';
        }
    }

    async function markLessonComplete(lessonId) {
        if (completedLessonIds.includes(lessonId)) return true; // Đã hoàn thành rồi

        try {
            const token = localStorage.getItem('token');
            const res = await fetch(`http://localhost:3000/api/users/progress/${lessonId}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) {
                completedLessonIds.push(lessonId);
                renderSidebar(); // Cập nhật lại UI sidebar
                return true;
            }
            return false;
        } catch (err) {
            console.error('Lỗi khi đánh dấu hoàn thành bài học:', err);
            return false;
        }
    }

    function renderQuizResults(data, quizzes) {
        const resultDiv = document.getElementById('quiz-result');
        resultDiv.style.display = 'block';
        
        let feedbackHTML = '<div class="feedback-list" style="margin-top:15px;">';
        
        quizzes.forEach((quiz, qIdx) => {
            const res = data.results.find(r => r.quiz_id === quiz.id);
            if (res && res.is_correct) {
                feedbackHTML += `<div style="color:#22c55e; margin-bottom:10px;"><i class="fas fa-check-circle"></i> Câu ${qIdx + 1}: Chính xác</div>`;
            } else {
                const correctOpt = quiz.options.find(o => o.id === (res ? res.correct_option_id : null));
                const correctText = correctOpt ? correctOpt.option_text : 'Chưa rõ';
                feedbackHTML += `<div style="color:#ef4444; margin-bottom:10px;"><i class="fas fa-times-circle"></i> Câu ${qIdx + 1}: Sai. Đáp án đúng là: ${correctText}</div>`;
            }
        });
        
        feedbackHTML += '</div>';

        resultDiv.innerHTML = `
            <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
                <div style="font-size:24px; font-weight:bold; color: ${data.percent === 100 ? '#22c55e' : '#eab308'};">
                    Kết quả: ${data.percent}% (${data.score}/${data.total})
                </div>
                ${feedbackHTML}
            </div>
        `;
        
        // Scroll to result
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function showToast(message, type = 'success') {
        let toastStyle = document.getElementById('custom-toast-style');
        if (!toastStyle) {
            toastStyle = document.createElement('style');
            toastStyle.id = 'custom-toast-style';
            toastStyle.innerHTML = `
                .custom-toast {
                    position: fixed;
                    bottom: 30px;
                    right: 30px;
                    background: rgba(15, 23, 42, 0.9);
                    backdrop-filter: blur(10px);
                    -webkit-backdrop-filter: blur(10px);
                    border: 1px solid rgba(124, 58, 237, 0.3);
                    box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.25), 0 0 15px rgba(124, 58, 237, 0.15);
                    color: #f8fafc;
                    padding: 16px 24px;
                    border-radius: 12px;
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    z-index: 99999;
                    font-family: inherit;
                    font-size: 14.5px;
                    font-weight: 500;
                    transform: translateY(100px);
                    opacity: 0;
                    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                }
                .custom-toast.show {
                    transform: translateY(0);
                    opacity: 1;
                }
                .custom-toast-icon {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 24px;
                    height: 24px;
                    border-radius: 50%;
                    font-size: 12px;
                }
                .custom-toast-success {
                    border-color: rgba(167, 139, 250, 0.3);
                    box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.25);
                }
                .custom-toast-success .custom-toast-icon {
                    background: rgba(167, 139, 250, 0.2);
                    color: #c084fc;
                }
                .custom-toast-error {
                    border-color: rgba(239, 68, 68, 0.3);
                    box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.25);
                }
                .custom-toast-error .custom-toast-icon {
                    background: rgba(239, 68, 68, 0.2);
                    color: #f87171;
                }
                .custom-toast-warning {
                    border-color: rgba(234, 179, 8, 0.3);
                    box-shadow: 0 10px 25px -5px rgba(234, 179, 8, 0.25);
                }
                .custom-toast-warning .custom-toast-icon {
                    background: rgba(234, 179, 8, 0.2);
                    color: #facc15;
                }
            `;
            document.head.appendChild(toastStyle);
        }

        const toast = document.createElement('div');
        toast.className = `custom-toast custom-toast-${type}`;
        
        let iconHtml = '<i class="fa-solid fa-check"></i>';
        if (type === 'error') {
            iconHtml = '<i class="fa-solid fa-triangle-exclamation"></i>';
        } else if (type === 'warning') {
            iconHtml = '<i class="fa-solid fa-circle-exclamation"></i>';
        }

        toast.innerHTML = `
            <div class="custom-toast-icon">
                ${iconHtml}
            </div>
            <div class="custom-toast-message">${message}</div>
        `;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.classList.add('show');
        }, 100);

        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => {
                document.body.removeChild(toast);
            }, 400);
        }, 3000);
    }

    async function loadCourseComments() {
        const commentsList = document.getElementById('comments-list');
        if (!commentsList) return;
        
        commentsList.innerHTML = '<div style="padding: 20px; color: #94a3b8; text-align: center;"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải ý kiến...</div>';
        
        try {
            const res = await fetch(`http://localhost:3000/api/comments?course_id=${courseId}`);
            const data = await res.json();
            
            if (data.success && data.data) {
                const comments = data.data;
                if (comments.length === 0) {
                    commentsList.innerHTML = '<div style="padding: 20px; color: #94a3b8; text-align: center; font-style: italic;">Chưa có ý kiến nào cho khóa học này. Hãy là người đầu tiên để lại bình luận!</div>';
                    return;
                }
                
                commentsList.innerHTML = comments.map(c => {
                    const name = c.full_name || c.username || 'Học viên ẩn danh';
                    const date = new Date(c.created_at).toLocaleString('vi-VN', {
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit'
                    });
                    
                    return `
                        <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 8px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 6px;">
                                <span style="font-weight: bold; color: #c084fc; font-size: 14px;"><i class="fa-solid fa-user" style="font-size: 12px; margin-right: 6px;"></i>${name}</span>
                                <span style="font-size: 11px; color: #64748b;">${date}</span>
                            </div>
                            <div style="color: #e2e8f0; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap;">${c.content}</div>
                        </div>
                    `;
                }).join('');
            } else {
                commentsList.innerHTML = '<div style="padding: 20px; color: #ef4444; text-align: center;">Lỗi tải danh sách ý kiến.</div>';
            }
        } catch (err) {
            console.error('Lỗi API comments:', err);
            commentsList.innerHTML = '<div style="padding: 20px; color: #ef4444; text-align: center;">Lỗi kết nối máy chủ.</div>';
        }
    }

    async function submitCourseComment() {
        const input = document.getElementById('comment-input');
        if (!input) return;
        
        const content = input.value.trim();
        if (!content) {
            showToast('Vui lòng nhập nội dung ý kiến!', 'warning');
            return;
        }
        
        const btn = document.getElementById('btn-submit-comment');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang gửi...';
        
        try {
            const token = localStorage.getItem('token');
            const res = await fetch('http://localhost:3000/api/comments', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ course_id: courseId, content })
            });
            const data = await res.json();
            
            if (data.success) {
                input.value = '';
                await loadCourseComments();
            } else {
                showToast('Gửi thất bại: ' + data.message, 'error');
            }
        } catch (err) {
            console.error(err);
            showToast('Lỗi kết nối khi gửi ý kiến.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Gửi ý kiến';
        }
    }

    function shareCourse() {
        const courseUrl = `${window.location.origin}/#chi-tiet-kh.html?id=${courseId}`;
        
        navigator.clipboard.writeText(courseUrl)
            .then(() => {
                showToast('Đã sao chép liên kết chia sẻ khóa học vào bộ nhớ tạm!');
            })
            .catch(err => {
                console.error(err);
                // Fallback
                const input = document.createElement('input');
                input.value = courseUrl;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('Đã sao chép liên kết chia sẻ khóa học!');
            });
    }

})();
</script>
