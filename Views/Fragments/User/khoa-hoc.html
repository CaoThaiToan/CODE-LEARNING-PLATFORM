<div class="page-hero">
    <div class="container">
        <h1 class="page-title">TẤT CẢ <span class="highlight">KHÓA HỌC</span></h1>
        <p class="page-desc">
            Khám phá danh sách các khóa học lập trình chất lượng cao từ cơ bản đến nâng cao.<br>
            Bắt đầu hành trình trở thành lập trình viên chuyên nghiệp ngay hôm nay.
        </p>

        <div class="filter-tabs">
            <button class="tab active" data-filter="all">TẤT CẢ</button>
            <button class="tab" data-filter="coban">CƠ BẢN</button>
            <button class="tab" data-filter="trungcap">TRUNG CẤP</button>
            <button class="tab" data-filter="nangcao">NÂNG CAO</button>
            <button class="tab" data-filter="thietke">THIẾT KẾ</button>
        </div>
    </div>
</div>

<div class="courses-section">
    <div class="container">
        <div class="courses-grid" id="user-courses-grid">
            <div style="width:100%; text-align:center; padding:50px; color:#6d28d9; grid-column: 1 / -1;">
                <i class="fa-solid fa-spinner fa-spin"></i> Đang tải khóa học...
            </div>
        </div>
    </div>
</div>

<script>
(async function initUserCourses() {
    const grid = document.getElementById('user-courses-grid');
    const tabs = document.querySelectorAll('.filter-tabs .tab');

    function renderCard(course) {
        const levelMap = {
            'coban': 'Cơ bản',
            'trungcap': 'Trung cấp',
            'nangcao': 'Nâng cao',
            'thietke': 'Thiết kế'
        };
        const levelLabel = course.level ? (levelMap[course.level] || course.level) : null;
        const thumb = course.thumbnail_url || './Public/images/img_TrangChu.png';

        // Badge MIỄN PHÍ - dùng inline style hoàn toàn, không dùng class badge để tránh position:absolute của CSS
        const freeBadge = `<span style="display:inline-block;background:rgba(10,10,20,0.82);color:white;font-weight:800;padding:5px 12px;border-radius:20px;font-size:11px;letter-spacing:0.5px;backdrop-filter:blur(6px);">MIỄN PHÍ</span>`;

        // Badge mức độ - chỉ hiển thị với khóa học miễn phí có level
        const levelBadge = levelLabel
            ? `<span style="display:inline-block;background:#7c3aed;color:white;font-weight:700;padding:5px 12px;border-radius:20px;font-size:11px;letter-spacing:0.5px;">${levelLabel.toUpperCase()}</span>`
            : '';

        return `
        <div class="course-card">
            <div class="card-thumb">
                <img src="${thumb}" alt="${course.title}" onerror="this.onerror=null; this.src='./Public/images/img_TrangChu.png';">
                <div style="position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;">
                    ${freeBadge}
                    ${levelBadge}
                </div>
            </div>
            <div class="card-body">
                <h3 class="card-title">${course.title}</h3>
                <p style="font-size:14px;color:#64748b;margin-bottom:12px;">${course.description || 'Chưa có mô tả'}</p>
            </div>
            <div class="card-footer">
                <a href="#" class="btn-detail" data-id="${course.id}">XEM CHI TIẾT</a>
            </div>
        </div>`;
    }

    try {
        // CHỈ lấy khóa học đã xuất bản và miễn phí (price = 0). VIP chỉ hiển thị ở khoa-hoc-vip.html
        const allFetchedCourses = await window.loadCourses('published');
        const allCourses = allFetchedCourses.filter(c => !c.price || Number(c.price) === 0);

        const renderGrid = (filter) => {
            let filtered = allCourses;
            if (filter !== 'all') {
                filtered = allCourses.filter(c => c.level === filter);
            }

            if (!filtered || filtered.length === 0) {
                grid.innerHTML = '<div style="width:100%;grid-column:1/-1;text-align:center;padding:50px;color:#64748b;">Không có khóa học nào ở mức độ này.</div>';
                return;
            }
            grid.innerHTML = filtered.map(renderCard).join('');

            // Gắn sự kiện xem chi tiết
            grid.querySelectorAll('.btn-detail').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.selectedCourseId = btn.getAttribute('data-id');
                    window.loadPage('chi-tiet-kh.html');
                });
            });
        };

        renderGrid('all');

        // Tab filter events
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderGrid(tab.getAttribute('data-filter'));
            });
        });

    } catch (err) {
        console.error(err);
        grid.innerHTML = '<div style="width:100%;grid-column:1/-1;text-align:center;padding:50px;color:#ef4444;">Lỗi khi tải khóa học.</div>';
    }
})();
</script>
