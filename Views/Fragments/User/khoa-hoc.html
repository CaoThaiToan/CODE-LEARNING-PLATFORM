<div class="page-hero">
    <div class="container">
        <h1 class="page-title">TẤT CẢ <span class="highlight">KHÓA HỌC</span></h1>
        <p class="page-desc">
            Khám phá danh sách các khóa học lập trình chất lượng cao từ cơ bản đến nâng cao.<br>
            Bắt đầu hành trình trở thành lập trình viên chuyên nghiệp ngay hôm nay.
        </p>

        <div class="filter-tabs">
            <button class="tab active" data-filter="all">TẤT CẢ</button>
            <button class="tab" data-filter="vip">KHÓA HỌC VIP</button>
        </div>
    </div>
</div>

<div class="courses-section">
    <div class="container">
        <div class="courses-grid" id="user-courses-grid">
            <div style="width:100%; text-align:center; padding:50px; color:#6d28d9; grid-column: 1 / -1;">
                <i class="fa-solid fa-spinner fa-spin"></i> Đang tải khóa học...
            </div>
        </div>
    </div>
</div>

<script>
(async function initUserCourses() {
    const grid = document.getElementById('user-courses-grid');
    const tabs = document.querySelectorAll('.filter-tabs .tab');

    function renderCard(course) {
        const isVip = course.price > 0;
        const badge = isVip 
            ? `<span class="badge" style="background:#ff8c00;color:white;">VIP</span>`
            : `<span class="badge badge-dark">MIỄN PHÍ</span>`;
        
        const thumb = course.thumbnail_url || './Public/images/img_TrangChu.png';
        
        return `
        <div class="course-card">
            <div class="card-thumb">
                <img src="${thumb}" alt="${course.title}" onerror="this.onerror=null; this.src='./Public/images/img_TrangChu.png';">
                ${badge}
            </div>
            <div class="card-body">
                <h3 class="card-title">${course.title}</h3>
                <p style="font-size:14px; color:#64748b; margin-bottom:12px;">${course.description || 'Chưa có mô tả'}</p>
                ${isVip ? `<div style="color:#ef4444; font-weight:800; margin-bottom:4px; font-size: 1.1rem;">${Number(course.price).toLocaleString('vi-VN')} ₫</div>` : ''}
            </div>
            ${isVip 
                ? `
                <div class="card-footer" style="display:flex; gap:12px; padding: 16px 20px;">
                    <a href="#" class="btn-detail" data-page="chi-tiet-kh.html" data-id="${course.id}" style="flex:1; justify-content:center; border: 1px solid #7c3aed; padding: 8px 0; border-radius: 8px;">CHI TIẾT</a>
                    <a href="#" class="btn-buy" onclick="alert('Tính năng thanh toán đang được phát triển!'); return false;" style="flex:1; justify-content:center; display:inline-flex; align-items:center; gap:6px; background:linear-gradient(135deg, #ff9800 0%, #f97316 100%); color:white; font-weight:700; font-size:0.85rem; padding: 8px 0; border-radius: 8px; transition: 0.3s; box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);">MUA <i class="fas fa-shopping-cart"></i></a>
                </div>`
                : `
                <div class="card-footer">
                    <a href="#" class="btn-detail" data-page="chi-tiet-kh.html" data-id="${course.id}">XEM CHI TIẾT</a>
                </div>`
            }
        </div>`;
    }

    try {
        // Chỉ lấy khóa học đã xuất bản
        const allCourses = await window.loadCourses('published');
        
        const renderGrid = (filter) => {
            let filtered = allCourses;
            if (filter === 'vip') {
                filtered = allCourses.filter(c => c.price > 0);
            }
            
            if (!filtered || filtered.length === 0) {
                grid.innerHTML = '<div style="width:100%; grid-column: 1 / -1; text-align:center; padding:50px; color:#64748b;">Không có khóa học nào.</div>';
                return;
            }
            grid.innerHTML = filtered.map(renderCard).join('');

            // Attach event for detail
            grid.querySelectorAll('.btn-detail').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.selectedCourseId = btn.getAttribute('data-id');
                    window.loadPage('chi-tiet-kh.html');
                });
            });
        };

        renderGrid('all');

        // Tab events
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderGrid(tab.getAttribute('data-filter'));
            });
        });

    } catch (err) {
        console.error(err);
        grid.innerHTML = '<div style="width:100%; grid-column: 1 / -1; text-align:center; padding:50px; color:#ef4444;">Lỗi khi tải khóa học.</div>';
    }
})();
</script>
