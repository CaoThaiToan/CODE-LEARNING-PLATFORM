<div class="page-hero">
    <div class="container">
        <h1 class="page-title">TẤT CẢ <span class="highlight">KHÓA HỌC</span></h1>
        <p class="page-desc">
            Khám phá danh sách các khóa học lập trình chất lượng cao từ cơ bản đến nâng cao.<br>
            Bắt đầu hành trình trở thành lập trình viên chuyên nghiệp ngay hôm nay.
        </p>

        <div class="filter-tabs">
            <button class="tab active" data-filter="all">TẤT CẢ</button>
            <button class="tab" data-filter="coban">CƠ BẢN</button>
            <button class="tab" data-filter="trungcap">TRUNG CẤP</button>
            <button class="tab" data-filter="nangcao">NÂNG CAO</button>
            <button class="tab" data-filter="thietke">THIẾT KẾ</button>
        </div>
    </div>
</div>

<div class="courses-section">
    <div class="container">
        <div class="courses-grid" id="user-courses-grid">
            <div class="user-loading grid-col-all">
                <i class="fa-solid fa-spinner fa-spin"></i> Đang tải khóa học...
            </div>
        </div>
    </div>
</div>

<script>
(async function initUserCourses() {
    const grid = document.getElementById('user-courses-grid');
    const tabs = document.querySelectorAll('.filter-tabs .tab');
    let currentFilter = 'all';

    function renderCard(course) {
        const levelMap = {
            'coban': 'Cơ bản',
            'trungcap': 'Trung cấp',
            'nangcao': 'Nâng cao',
            'thietke': 'Thiết kế'
        };
        const levelLabel = course.level ? (levelMap[course.level] || course.level) : null;
        const thumb = course.thumbnail_url || './Public/images/img_TrangChu.png';

        const freeBadge = `<span class="tag-free">MIỄN PHÍ</span>`;
        const levelBadge = levelLabel
            ? `<span class="tag-level-purple">${levelLabel.toUpperCase()}</span>`
            : '';

        return `
        <div class="course-card">
            <div class="card-thumb">
                <img src="${thumb}" alt="${course.title}" onerror="this.onerror=null; this.src='./Public/images/img_TrangChu.png';">
                <div class="card-thumb-badge-wrapper">
                    ${freeBadge}
                    ${levelBadge}
                </div>
            </div>
            <div class="card-body">
                <h3 class="card-title">${course.title}</h3>
                <p class="card-desc">${course.description || 'Chưa có mô tả'}</p>
            </div>
            <div class="card-footer">
                <a href="#" class="btn-detail" data-id="${course.id}">XEM CHI TIẾT</a>
            </div>
        </div>`;
    }

    async function fetchAndRender(filter, searchQuery = '') {
        try {
            console.log(`[khoa-hoc.html] fetchAndRender: filter=${filter}, searchQuery="${searchQuery}"`);
            grid.innerHTML = `<div class="user-loading grid-col-all"><i class="fa-solid fa-spinner fa-spin"></i> Đang tìm kiếm...</div>`;
            
            // Lấy khóa học từ server (kèm search query)
            const allFetchedCourses = await window.loadCourses('published', searchQuery);
            console.log(`[khoa-hoc.html] API returned ${allFetchedCourses.length} courses`);
            
            // Lọc khóa học miễn phí (khoa-hoc.html chỉ hiện khóa học FREE)
            const freeCourses = allFetchedCourses.filter(c => !c.price || Number(c.price) === 0);
            const vipCount = allFetchedCourses.length - freeCourses.length;

            let filtered = freeCourses;
            if (filter !== 'all') {
                filtered = freeCourses.filter(c => c.level === filter);
            }

            if (!filtered || filtered.length === 0) {
                let emptyMsg = searchQuery 
                    ? `Không tìm thấy khóa học miễn phí nào khớp với "${searchQuery}"` 
                    : 'Không có khóa học nào ở mức độ này.';
                
                // Nếu tìm thấy khóa học VIP nhưng không thấy khóa học free
                if (searchQuery && vipCount > 0 && freeCourses.length === 0) {
                    emptyMsg += `<br><p style="font-size:14px; margin-top:10px; color:#64748b;">
                        Tìm thấy ${vipCount} khóa học VIP khớp với từ khóa. 
                        Bạn có thể xem tại trang <a href="#" data-page="khoa-hoc-vip.html" style="color:#7c3aed; font-weight:700;">Khóa học VIP <i class="fa-solid fa-crown"></i></a>
                    </p>`;
                }

                grid.innerHTML = `<div class="user-empty-state grid-col-all text-center-padded">${emptyMsg}</div>`;
                
                // Re-attach link inside empty message
                grid.querySelectorAll('[data-page]').forEach(link => {
                    link.addEventListener('click', e => {
                        e.preventDefault();
                        window.loadPage(link.getAttribute('data-page'));
                    });
                });
                return;
            }
            
            grid.innerHTML = filtered.map(renderCard).join('');

            grid.querySelectorAll('.btn-detail').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.selectedCourseId = btn.getAttribute('data-id');
                    window.loadPage('chi-tiet-kh.html');
                });
            });
        } catch (err) {
            console.error('[khoa-hoc.html] fetchAndRender error:', err);
            grid.innerHTML = '<div class="user-error-box-full">Lỗi khi tải khóa học.</div>';
        }
    }

    // Khởi tạo lần đầu (sử dụng searchQuery nếu có)
    await fetchAndRender(currentFilter, window.searchQuery);

    // Lắng nghe sự kiện search từ navbar
    const searchHandler = (e) => {
        fetchAndRender(currentFilter, e.detail);
    };
    window.addEventListener('courseSearch', searchHandler);

    // Xử lý khi tab thay đổi
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentFilter = tab.getAttribute('data-filter');
            fetchAndRender(currentFilter, window.searchQuery);
        });
    });

    // Quan trọng: Gỡ bỏ event listener khi fragment bị gỡ bỏ để tránh memory leak/duplicate calls
    // Tuy nhiên trong hệ thống SPA đơn giản này, ta có thể kiểm tra window.currentPage
    const cleanupInterval = setInterval(() => {
        if (window.currentPage !== 'khoa-hoc.html') {
            window.removeEventListener('courseSearch', searchHandler);
            clearInterval(cleanupInterval);
        }
    }, 1000);

})();
</script>
