<div class="page-bg">
    <div class="container">

        <!-- Breadcrumb -->
        <nav class="breadcrumb">
            <a href="#" data-page="trang-chu.html">Trang chủ</a>
            <i class="fas fa-chevron-right"></i>
            <a href="#" data-page="khoa-hoc.html">Khóa học</a>
            <i class="fas fa-chevron-right"></i>
            <span>Lập trình Web cơ bản (HTML/CSS)</span>
        </nav>

        <!-- Main 2-column layout -->
        <div class="detail-layout" id="course-detail-container">
            <div class="detail-loading">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p class="mt-10">Đang tải dữ liệu khóa học...</p>
            </div>
        </div><!-- end detail-layout -->
    </div><!-- end container -->
</div><!-- end page-bg -->

<script>
(async function initCourseDetail() {
    const courseId = window.selectedCourseId;
    if (!courseId) {
        document.getElementById('course-detail-container').innerHTML = `
            <div class="detail-loading text-error">
                Không tìm thấy thông tin khóa học.
            </div>`;
        return;
    }

    try {
        // Fetch course info
        const courseRes = await apiFetch('/courses/' + courseId);
        if (!courseRes.success) throw new Error('Không thể tải khóa học');
        const course = courseRes.data;

        // Fetch lessons
        const lessonsRes = await apiFetch('/lessons?course_id=' + courseId);
        const lessons = lessonsRes.success ? lessonsRes.data : [];

        // Check enrollment
        let isEnrolled = false;
        const token = localStorage.getItem('token');
        if (token) {
            try {
                const enrollRes = await apiFetch('/users/me/courses');
                if (enrollRes.success) {
                    isEnrolled = enrollRes.data.some(e => e.course_id == courseId && e.enrollment_status === 'active');
                }
            } catch (e) { console.error('Lỗi check enroll', e); }
        }

        const isVip = course.price > 0;
        const isLocked = isVip && !isEnrolled;
        
        // --- 1. Breadcrumb & Titles ---
        const breadcrumbTitle = course.title;
        const mainTitle = course.title.toUpperCase();
        
        // --- 2. What you'll learn (from description) ---
        // Break description into lines for the list if needed, or just show as text
        const descText = course.description || 'Chưa có mô tả cho khóa học này.';
        
        // --- 3. Lessons list ---
        let lessonsHtml = '';
        if (lessons.length === 0) {
            lessonsHtml = '<div class="empty-lessons">Khóa học này chưa có bài học nào.</div>';
        } else {
            lessons.forEach((lesson, index) => {
                const icon = isLocked ? '<i class="fas fa-lock text-error"></i>' : '<i class="far fa-play-circle"></i>';
                let tagClass, tagText;
                if (isLocked) {
                    tagClass = 'lock-tag'; tagText = 'Cần mở khóa';
                } else if (isEnrolled) {
                    tagClass = 'free-tag'; tagText = 'Đã mở khóa';
                } else {
                    tagClass = 'free-tag'; tagText = 'Học miễn phí';
                }
                const rowClass = isLocked ? 'locked' : 'free';
                
                lessonsHtml += `
                <div class="lesson-row ${rowClass}">
                    <div class="lesson-num">${index + 1}</div>
                    <div class="lesson-info">
                        <span class="lesson-name">${lesson.title}</span>
                        <span class="lesson-time">${icon} Video</span>
                    </div>
                    <span class="lesson-tag ${tagClass}">${tagText}</span>
                </div>`;
            });
        }

        // --- 4. Sidebar Pricing & CTA ---
        let priceLabel = isVip ? 'CÓ PHÍ' : 'Miễn phí';
        let priceValueHtml = isVip ? `<div class="price-value-large">${Number(course.price).toLocaleString('vi-VN')} ₫</div>` : '';
        let ctaText = 'BẮT ĐẦU HỌC NGAY';
        let ctaAction = isVip ? 'window.loadPage("thanh-toan.html");' : 'window.loadPage("begin-kh.html");';
        let ctaClass = 'btn-enroll';

        if (isEnrolled) {
            priceLabel = 'TRẠNG THÁI';
            priceValueHtml = `<div class="price-value-large" style="color:#22c55e;font-size:18px;"><i class="fa-solid fa-circle-check"></i> Đã sở hữu</div>`;
            ctaText = 'VÀO HỌC NGAY';
            ctaAction = 'window.loadPage("begin-kh.html");';
            ctaClass = 'btn-enroll';
        } else if (isLocked) {
            ctaText = 'ĐĂNG KÝ HỌC';
        }

        const ctaBtn = `<button class="${ctaClass} btn-full" onclick='${ctaAction}'>${ctaText}</button>`;

        // Render everything
        document.getElementById('course-detail-container').innerHTML = `
            <!-- ===== LEFT CONTENT ===== -->
            <div class="detail-main flex-1">
                <h1 class="course-title">${mainTitle}</h1>
                
                <!-- What you'll learn -->
                <div class="learn-box">
                    <h2 class="section-heading">BẠN SẼ HỌC ĐƯỢC GÌ?</h2>
                    <div class="text-content">
                        ${descText.replace(/\n/g, '<br>')}
                    </div>
                </div>

                <!-- Course content -->
                <div class="curriculum mt-20">
                    <div class="curriculum-header">
                        <h2 class="section-heading">
                            <span class="section-icon"><i class="fas fa-th-large"></i></span>
                            NỘI DUNG KHÓA HỌC
                        </h2>
                        <div class="curriculum-meta">
                            <span><i class="fas fa-book-open"></i> ${lessons.length} bài học</span>
                        </div>
                    </div>
                    <div class="lesson-list">
                        ${lessonsHtml}
                    </div>
                </div>
            </div>

            <!-- ===== RIGHT SIDEBAR ===== -->
            <aside class="detail-sidebar">
                <div class="sidebar-card">
                    <!-- Video preview -->
                    <div class="preview-video">
                        <img src="${course.thumbnail_url || './Public/images/img_TrangChu.png'}" alt="Preview" class="preview-thumb" onerror="this.onerror=null; this.src='./Public/images/img_TrangChu.png';">
                        <div class="preview-overlay">
                            <div class="preview-play"><i class="fas fa-play"></i></div>
                        </div>
                        <div class="preview-label">Xem giới thiệu</div>
                    </div>

                    <!-- Price & CTA -->
                    <div class="sidebar-body">
                        <p class="price-label sidebar-price-label">${priceLabel}</p>
                        ${priceValueHtml}
                        ${ctaBtn}

                        <!-- Course stats -->
                        <ul class="course-stats mt-20">
                            <li>
                                <span class="stat-label"><i class="fas fa-book-open"></i> Tổng số bài học:</span>
                                <span class="stat-value">${lessons.length}</span>
                            </li>
                            <li>
                                <span class="stat-label"><i class="fas fa-users"></i> Học viên:</span>
                                <span class="stat-value">${course.student_count || 0}</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </aside>
        `;

        // Update Breadcrumb
        document.querySelector('.breadcrumb span').textContent = breadcrumbTitle;

    } catch (err) {
        console.error(err);
        document.getElementById('course-detail-container').innerHTML = `
            <div class="detail-loading text-error">
                Lỗi tải chi tiết khóa học.
            </div>`;
    }
})();
</script>
    </div><!-- end container -->
</div><!-- end page-bg -->
