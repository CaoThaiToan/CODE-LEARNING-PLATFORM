<div class="page-bg">
    <div class="container">

        <!-- Breadcrumb -->
        <nav class="breadcrumb">
            <a href="#" data-page="trang-chu.html">Trang chủ</a>
            <i class="fas fa-chevron-right"></i>
            <a href="#" data-page="khoa-hoc.html">Khóa học</a>
            <i class="fas fa-chevron-right"></i>
            <span>Lập trình Web cơ bản (HTML/CSS)</span>
        </nav>

        <!-- Main 2-column layout -->
        <div class="detail-layout" id="course-detail-container">
            <div style="width:100%; text-align:center; padding:50px; color:#6d28d9;">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top:10px;">Đang tải dữ liệu khóa học...</p>
            </div>
        </div><!-- end detail-layout -->
    </div><!-- end container -->
</div><!-- end page-bg -->

<script>
(async function initCourseDetail() {
    const courseId = window.selectedCourseId;
    if (!courseId) {
        document.getElementById('course-detail-container').innerHTML = `
            <div style="width:100%; text-align:center; padding:50px; color:#ef4444;">
                Không tìm thấy thông tin khóa học.
            </div>`;
        return;
    }

    try {
        // Fetch course info
        const courseRes = await apiFetch('/courses/' + courseId);
        if (!courseRes.success) throw new Error('Không thể tải khóa học');
        const course = courseRes.data;

        // Fetch lessons
        const lessonsRes = await apiFetch('/lessons?course_id=' + courseId);
        const lessons = lessonsRes.success ? lessonsRes.data : [];

        const isVip = course.price > 0;
        
        // --- 1. Breadcrumb & Titles ---
        const breadcrumbTitle = course.title;
        const mainTitle = course.title.toUpperCase();
        
        // --- 2. What you'll learn (from description) ---
        // Break description into lines for the list if needed, or just show as text
        const descText = course.description || 'Chưa có mô tả cho khóa học này.';
        
        // --- 3. Lessons list ---
        let lessonsHtml = '';
        if (lessons.length === 0) {
            lessonsHtml = '<div style="padding:20px; text-align:center; color:#64748b;">Khóa học này chưa có bài học nào.</div>';
        } else {
            lessons.forEach((lesson, index) => {
                // If it's VIP and not paid (for now just indicate locked if VIP, or if free indicate free)
                const isLocked = isVip; 
                const icon = isLocked ? '<i class="fas fa-lock" style="color:#ef4444;"></i>' : '<i class="far fa-play-circle"></i>';
                const tagClass = isLocked ? 'lock-tag' : 'free-tag';
                const tagText = isLocked ? 'Cần mở khóa' : 'Học miễn phí';
                const rowClass = isLocked ? 'locked' : 'free';
                
                lessonsHtml += `
                <div class="lesson-row ${rowClass}">
                    <div class="lesson-num">${index + 1}</div>
                    <div class="lesson-info">
                        <span class="lesson-name">${lesson.title}</span>
                        <span class="lesson-time">${icon} Video</span>
                    </div>
                    <span class="lesson-tag ${tagClass}">${tagText}</span>
                </div>`;
            });
        }

        // --- 4. Sidebar Pricing & CTA ---
        const priceLabel = isVip ? 'CÓ PHÍ' : 'Miễn phí';
        const priceValueHtml = isVip ? `<div style="font-size:24px; color:#ef4444; font-weight:bold; margin-bottom:15px;">${Number(course.price).toLocaleString('vi-VN')} ₫</div>` : '';
        const ctaText = 'BẮT ĐẦU HỌC NGAY';
        const ctaAction = isVip ? 'alert("Bạn phải đóng phí cho khóa học này");' : 'window.loadPage("begin-kh.html");';
        const ctaBtn = `<button class="btn-enroll" style="width:100%;" onclick='${ctaAction}'>${ctaText}</button>`;

        // Render everything
        document.getElementById('course-detail-container').innerHTML = `
            <!-- ===== LEFT CONTENT ===== -->
            <div class="detail-main">
                <h1 class="course-title">${mainTitle}</h1>
                
                <!-- What you'll learn -->
                <div class="learn-box">
                    <h2 class="section-heading">BẠN SẼ HỌC ĐƯỢC GÌ?</h2>
                    <div style="color:#475569; line-height:1.8; margin-top:15px;">
                        ${descText.replace(/\\n/g, '<br>')}
                    </div>
                </div>

                <!-- Course content -->
                <div class="curriculum">
                    <div class="curriculum-header">
                        <h2 class="section-heading">
                            <span class="section-icon"><i class="fas fa-th-large"></i></span>
                            NỘI DUNG KHÓA HỌC
                        </h2>
                        <div class="curriculum-meta">
                            <span><i class="fas fa-book-open"></i> ${lessons.length} bài học</span>
                        </div>
                    </div>
                    <div class="lesson-list">
                        ${lessonsHtml}
                    </div>
                </div>
            </div>

            <!-- ===== RIGHT SIDEBAR ===== -->
            <aside class="detail-sidebar">
                <div class="sidebar-card">
                    <!-- Video preview -->
                    <div class="preview-video">
                        <img src="${course.thumbnail_url || './Public/images/img_TrangChu.png'}" alt="Preview" class="preview-thumb" onerror="this.onerror=null; this.src='./Public/images/img_TrangChu.png';">
                        <div class="preview-overlay">
                            <div class="preview-play"><i class="fas fa-play"></i></div>
                        </div>
                        <div class="preview-label">Xem giới thiệu</div>
                    </div>

                    <!-- Price & CTA -->
                    <div class="sidebar-body">
                        <p class="price-label" style="font-weight:bold; color:#1e293b;">${priceLabel}</p>
                        ${priceValueHtml}
                        ${ctaBtn}

                        <!-- Course stats -->
                        <ul class="course-stats" style="margin-top:20px;">
                            <li>
                                <span class="stat-label"><i class="fas fa-book-open"></i> Tổng số bài học:</span>
                                <span class="stat-value">${lessons.length}</span>
                            </li>
                            <li>
                                <span class="stat-label"><i class="fas fa-users"></i> Học viên:</span>
                                <span class="stat-value">${course.student_count || 0}</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </aside>
        `;

        // Update Breadcrumb
        document.querySelector('.breadcrumb span').textContent = breadcrumbTitle;

    } catch (err) {
        console.error(err);
        document.getElementById('course-detail-container').innerHTML = `
            <div style="width:100%; text-align:center; padding:50px; color:#ef4444;">
                Lỗi tải chi tiết khóa học.
            </div>`;
    }
})();
</script>
    </div><!-- end container -->
</div><!-- end page-bg -->
