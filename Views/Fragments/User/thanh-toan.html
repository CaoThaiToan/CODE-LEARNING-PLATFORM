<div class="checkout-page">
    <div class="checkout-header">
        <a href="#" class="back-link" data-page="khoa-hoc-vip.html">
            <i class="fa-solid fa-chevron-left"></i> Quay lại chọn khóa học
        </a>
    </div>

    <div class="checkout-grid">
        
        <div class="checkout-left">
            <div class="checkout-box">
                <h2 class="section-title">THÔNG TIN THANH TOÁN</h2>
                
                <form class="checkout-form">
                    <div class="form-group">
                        <label>Họ và tên <span class="required">*</span></label>
                        <input type="text" placeholder="Nguyễn Văn A" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" placeholder="email@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="tel" placeholder="0912345678">
                    </div>

                    <div class="divider"></div>

                    <h2 class="section-title">PHƯƠNG THỨC THANH TOÁN</h2>

                    <label class="payment-method">
                        <input type="radio" name="payment" value="momo" checked>
                        <div class="method-card momo-active">
                            <div class="radio-custom"></div>
                            <div class="method-icon bg-pink">
                                <i class="fa-solid fa-wallet text-pink"></i>
                            </div>
                            <div class="method-info">
                                <h4>Ví MoMo</h4>
                                <p>Quét mã QR qua ứng dụng MoMo</p>
                            </div>
                        </div>
                    </label>

                    <label class="payment-method">
                        <input type="radio" name="payment" value="vnpay">
                        <div class="method-card">
                            <div class="radio-custom"></div>
                            <div class="method-icon bg-blue">
                                <i class="fa-solid fa-qrcode text-blue"></i>
                            </div>
                            <div class="method-info">
                                <h4>VNPAY-QR</h4>
                                <p>Thanh toán qua ứng dụng ngân hàng</p>
                            </div>
                        </div>
                    </label>

                    <label class="payment-method">
                        <input type="radio" name="payment" value="card">
                        <div class="method-card">
                            <div class="radio-custom"></div>
                            <div class="method-icon bg-purple">
                                <i class="fa-regular fa-credit-card text-purple"></i>
                            </div>
                            <div class="method-info">
                                <h4>Thẻ thanh toán quốc tế</h4>
                                <p>Visa, Mastercard, JCB, thẻ nội địa</p>
                            </div>
                        </div>
                    </label>

                    <button type="submit" class="btn-pay">THANH TOÁN 1.500.000 Đ</button>

                    <div class="security-note">
                        <i class="fa-solid fa-shield-halved"></i> Thông tin thanh toán của bạn được mã hóa an toàn
                    </div>
                </form>
            </div>
        </div>

        <div class="checkout-right">
            <div class="summary-box">
                <h2 class="section-title">TÓM TẮT ĐƠN HÀNG</h2>
                
                <div class="product-item">
                    <img src="https://images.unsplash.com/photo-1633356122544-f134324a6cee?q=80&w=200&auto=format&fit=crop" alt="ReactJS Course">
                    <div class="product-details">
                        <span class="badge-orange">KHÓA HỌC VIP</span>
                        <h3>Master ReactJS & NextJS Pro</h3>
                        <span class="old-price">3.000.000 đ</span>
                    </div>
                </div>

                <div class="divider-dashed"></div>

                <div class="price-row">
                    <span class="label">Giá gốc</span>
                    <span class="value">3.000.000 đ</span>
                </div>
                <div class="price-row text-green">
                    <span class="label">Giảm giá</span>
                    <span class="value">- 1.500.000 đ</span>
                </div>
                <div class="price-row text-muted">
                    <span class="label">Thuế VAT</span>
                    <span class="value">Đã bao gồm</span>
                </div>

                <div class="divider-dashed"></div>

                <div class="total-row">
                    <div class="total-label">
                        <span class="main">TỔNG CỘNG</span>
                        <span class="sub">Đã bao gồm VAT</span>
                    </div>
                    <div class="total-price">1.500.000 đ</div>
                </div>
            </div>
        </div>
    </div>
</div>
