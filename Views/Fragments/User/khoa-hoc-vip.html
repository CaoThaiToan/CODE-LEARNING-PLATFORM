<div class="main-content">
    <div class="glow-bg"></div>

    <section class="hero">
        <div class="crown-icon">
            <i class="fa-solid fa-crown"></i>
        </div>
        <h1> <span class="highlight"> KHÓA HỌC PREMIUM VIP</span></h1>
        <p>Nâng tầm kỹ năng với các khóa học chuyên sâu được thiết kế đặc biệt. Nhận sự hỗ trợ tận tình từ chuyên gia, học tập qua dự án thực tế và nhận chứng chỉ giá trị.</p>
    </section>

    <section class="course-grid" id="vip-courses-grid">
        <div class="vip-loading">
            <i class="fa-solid fa-spinner fa-spin"></i> Đang tải danh sách khóa học VIP...
        </div>
    </section>
</div>

<script>
(async function initVipCourses() {
    const grid = document.getElementById('vip-courses-grid');

    function renderVipCard(course, index, isEnrolled) {
        const thumb = course.thumbnail_url || './Public/images/img_TrangChu.png';
        const priceStr = Number(course.price).toLocaleString('vi-VN');
        
        // Luân phiên các badge và bg class cho đa dạng nếu không có ảnh
        const bgs = ['bg-react', 'bg-node', ''];
        const bgClass = bgs[index % bgs.length];

        let priceHtml = `<span class="new-price">${priceStr} đ</span>`;
        let btnHtml = `<button class="buy-btn btn-buy-vip" data-id="${course.id}">MUA NGAY</button>`;

        if (isEnrolled) {
            priceHtml = `<span class="new-price" style="color:#22c55e;"><i class="fa-solid fa-circle-check"></i> ĐÃ SỞ HỮU</span>`;
            btnHtml = `<button class="buy-btn btn-enter-course" data-id="${course.id}" style="background:linear-gradient(135deg, #10b981, #059669);box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);">VÀO HỌC NGAY</button>`;
        }

        return `
        <article class="card">
            <div class="card-image card-image-vip" style="background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)), url('${thumb}');">
                <span class="badge top-right"><i class="fa-solid fa-crown"></i> VIP</span>
                <div class="image-bottom">
                    <span class="badge bottom-left">VIP - ĐỘC QUYỀN</span>
                </div>
            </div>
            <div class="card-content">
                <h2 class="course-title">${course.title}</h2>
                
                <div class="course-meta">
                    <span><i class="fa-solid fa-book-open"></i> Bài học đặc biệt</span>
                    <span><i class="fa-regular fa-clock"></i> Truy cập mãi mãi</span>
                    <span><i class="fa-solid fa-user-shield"></i> Hỗ trợ 24/7</span>
                </div>

                <div class="vip-features">
                    <h3>ĐẶC QUYỀN VIP:</h3>
                    <ul>
                        <li>Hỗ trợ 1-1 cùng chuyên gia</li>
                        <li>Tham gia nhóm học tập kín</li>
                        <li>Review code trực tiếp</li>
                        <li>Chứng chỉ hoàn thành VIP</li>
                    </ul>
                </div>

                <div class="card-footer">
                    <div class="price-info">
                        ${priceHtml}
                    </div>
                    ${btnHtml}
                </div>
            </div>
        </article>`;
    }

    try {
        if (typeof window.loadCourses !== 'function') throw new Error('API chưa sẵn sàng');

        const allCourses = await window.loadCourses('published');
        const vipCourses = allCourses.filter(c => c.price > 0);

        if (!vipCourses || vipCourses.length === 0) {
            grid.innerHTML = '<div class="vip-empty-state">Hiện chưa có khóa học VIP nào được mở bán.</div>';
            return;
        }

        // Fetch enrollments
        let userEnrollments = [];
        const token = localStorage.getItem('token');
        if (token) {
            try {
                const enrollRes = await apiFetch('/users/me/courses');
                if (enrollRes.success) {
                    userEnrollments = enrollRes.data.filter(e => e.enrollment_status === 'active').map(e => e.course_id);
                }
            } catch (e) { console.error('Lỗi check enroll', e); }
        }

        grid.innerHTML = vipCourses.map((c, i) => renderVipCard(c, i, userEnrollments.includes(c.id))).join('');

        // Gắn sự kiện mua khóa học
        grid.querySelectorAll('.btn-buy-vip').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                window.selectedCourseId = btn.getAttribute('data-id');
                // Chuyển tới trang thanh toán
                window.loadPage('thanh-toan.html');
            });
        });

        // Gắn sự kiện vào học ngay (nếu đã sở hữu)
        grid.querySelectorAll('.btn-enter-course').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                window.selectedCourseId = btn.getAttribute('data-id');
                // Có thể chuyển sang chi-tiet-kh.html để họ xem tổng quan, hoặc thẳng vào begin-kh.html
                window.loadPage('chi-tiet-kh.html'); 
            });
        });

    } catch (err) {
        console.error('[khoa-hoc-vip] Lỗi:', err);
        grid.innerHTML = '<div class="vip-error-box">Lỗi khi tải danh sách khóa học VIP.</div>';
    }
})();
</script>
