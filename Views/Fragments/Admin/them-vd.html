<div class="form-center">
    <div class="form-container-card">
        <!-- Header + nút quay lại -->
        <div class="flex items-center gap-14 mb-6">
            <button type="button" id="btn-back-to-lessons" class="btn-back-admin">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </button>
            <div>
                <h1 class="form-title mb-4" id="vd-form-title">THÊM BÀI HỌC VIDEO</h1>
                <p class="form-subtitle" id="vd-form-sub">Tạo video bài giảng và câu hỏi trắc nghiệm.</p>
            </div>
        </div>

        <!-- Toast thông báo -->
        <div id="vd-toast" class="toast-vd display-none"></div>

        <form id="lessonForm">
            <div class="form-group">
                <label>Tên bài học</label>
                <input type="text" id="lessonName" placeholder="Ví dụ: Giới thiệu HTML/CSS" required>
            </div>

            <div class="form-group">
                <label>Thuộc khóa học</label>
                <select class="form-select" id="courseSelect">
                    <option value="">-- Đang tải khóa học... --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nội dung chính bài học</label>
                <textarea id="lessonTheory" placeholder="Nhập tóm tắt hoặc nội dung lý thuyết chính của bài học..." style="height: 120px;"></textarea>
            </div>

            <div class="form-group">
                <label>Video bài giảng (Tải lên Cloudinary)</label>
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                    <input type="file" id="videoFile" accept="video/*" class="input-full-padded" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                    <button type="button" id="btn-upload-video" class="btn-submit-form" style="width: auto; padding: 0 20px; height: 42px; margin: 0;">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Tải lên
                    </button>
                </div>
                <!-- Chứa URL trả về từ Cloudinary -->
                <div class="input-with-icon">
                    <i class="fa-solid fa-link"></i>
                    <input type="text" id="youtubeLink" placeholder="Đường dẫn video sẽ hiện ở đây sau khi tải lên..." readonly style="background: #f5f5f5; cursor: not-allowed;">
                </div>
                
                <!-- Thanh tiến trình (Progress Bar) -->
                <div id="upload-progress-container" style="display: none; margin-top: 10px;">
                    <div style="width: 100%; background: #e0e0e0; border-radius: 4px; height: 10px; overflow: hidden;">
                        <div id="upload-progress-bar" style="width: 0%; background: #7c3aed; height: 100%; transition: width 0.2s;"></div>
                    </div>
                    <span id="upload-progress-text" style="font-size: 12px; color: #666; font-weight: 600;">0%</span>
                </div>
            </div>

            <hr class="divider-margin">

            <h3 class="quiz-section-title">📝 Câu hỏi trắc nghiệm <span class="text-muted-small">(không bắt buộc)</span></h3>

            <div id="quizContainer"></div>

            <button type="button" onclick="addQuestionField()" class="btn-submit-form btn-secondary-gray">
                + Thêm câu hỏi mới
            </button>

            <button type="button" id="btn-save-lesson" class="btn-submit-form">
                <i class="fa-solid fa-cloud-upload"></i> <span id="btn-save-text">LƯU BÀI HỌC</span>
            </button>
        </form>
    </div>
</div>

<script>
(async function initLessonForm() {
    const isEditing    = !!window.editingLessonId;
    const lessonId     = window.editingLessonId;
    const toast        = document.getElementById('vd-toast');

    // ── Cập nhật tiêu đề form ─────────────────────────────
    if (isEditing) {
        document.getElementById('vd-form-title').textContent = 'CHỈNH SỬA BÀI HỌC';
        document.getElementById('vd-form-sub').textContent   = 'Cập nhật nội dung bài học và câu hỏi.';
        document.getElementById('btn-save-text').textContent = 'CẬP NHẬT BÀI HỌC';
    }

    function showToast(msg, isError = false) {
        toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ` + msg;
        
        // Cố định vị trí Toast luôn nổi trên màn hình (Fixed Position)
        toast.style.position = 'fixed';
        toast.style.bottom = '40px';
        toast.style.right = '40px';
        toast.style.zIndex = '99999';
        toast.style.padding = '16px 24px';
        toast.style.borderRadius = '12px';
        toast.style.boxShadow = '0 10px 30px rgba(0,0,0,0.2)';
        toast.style.fontSize = '16px';
        toast.style.fontWeight = '700';
        toast.style.display = 'flex';
        toast.style.alignItems = 'center';
        toast.style.gap = '10px';
        toast.style.transition = 'all 0.3s ease';
        
        toast.style.background  = isError ? '#fee2e2' : '#dcfce7';
        toast.style.color       = isError ? '#ef4444' : '#16a34a';
        toast.style.borderLeft  = isError ? '6px solid #ef4444' : '6px solid #16a34a';
        
        toast.classList.remove('display-none');
        
        // Hủy timer cũ nếu click liên tục
        if (window.toastTimer) clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => { 
            toast.classList.add('display-none'); 
        }, 3500);
    }

    // ── Load danh sách khóa học ───────────────────────────
    async function loadCourseOptions(selectedId) {
        const select = document.getElementById('courseSelect');
        try {
            const courses = await window.loadCourses();
            select.innerHTML = '<option value="">-- Chọn khóa học --</option>';
            if (!courses || courses.length === 0) {
                select.innerHTML += '<option disabled>Chưa có khóa học nào</option>';
                return;
            }
            courses.forEach(course => {
                const opt = document.createElement('option');
                opt.value = course.id;
                opt.textContent = course.title;
                if (String(course.id) === String(selectedId)) opt.selected = true;
                select.appendChild(opt);
            });
        } catch {
            select.innerHTML = '<option value="">-- Lỗi tải khóa học --</option>';
        }
    }

    // ── Reindex câu hỏi ──────────────────────────────────
    function reindexQuestions() {
        document.querySelectorAll('#quizContainer .question-block').forEach((block, i) => {
            const label = block.querySelector('.question-label');
            if (label) label.innerHTML = `<strong>Câu ${i + 1}:</strong>`;
        });
    }

    // ── Xóa câu hỏi ──────────────────────────────────────
    window.removeQuestion = function(btn) {
        const block = btn.closest('.question-block');
        if (!block) return;
        block.classList.add('removing-question');
        setTimeout(() => { block.remove(); reindexQuestions(); }, 300);
    };

    // ── Thêm câu hỏi ─────────────────────────────────────
    window.addQuestionField = function(questionText = '', optTexts = ['','','',''], correctLabel = 'A') {
        const container = document.getElementById('quizContainer');
        const index     = container.children.length + 1;
        const labels    = ['A','B','C','D'];

        const wrapper       = document.createElement('div');
        wrapper.className   = 'question-block question-block-style';

        wrapper.innerHTML = `
            <button type="button" onclick="removeQuestion(this)" class="btn-remove-question" title="Xóa câu hỏi">
                <i class="fa-solid fa-trash-can"></i>
            </button>
            <label class="question-label"><strong>Câu ${index}:</strong></label>
            <input type="text" class="question-text input-quiz" value="${questionText.replace(/"/g,'&quot;')}"
                placeholder="Nhập câu hỏi ở đây...">
            <div class="grid-quiz-options">
                ${labels.map((lbl, i) => `
                <div>
                    <label>${lbl}.</label>
                    <input type="text" class="option input-full-padded" value="${(optTexts[i]||'').replace(/"/g,'&quot;')}"
                        placeholder="Đáp án ${lbl}">
                </div>`).join('')}
            </div>
            <label class="mt-15 block font-600">Đáp án đúng:</label>
            <select class="correct-answer select-quiz">
                ${labels.map(lbl => `<option value="${lbl}" ${lbl === correctLabel ? 'selected' : ''}>${lbl}</option>`).join('')}
            </select>`;

        container.appendChild(wrapper);
    };

    // ── Load danh sách khóa học trước tiên ───────────────
    let preselectedCourseId = window.selectedCourseId || '';
    await loadCourseOptions(preselectedCourseId);

    // ── Load dữ liệu bài học cũ nếu đang Edit ────────────
    if (isEditing) {
        try {
            const lesson = await window.getLessonById(lessonId);
            if (lesson) {
                document.getElementById('lessonName').value  = lesson.title || '';
                document.getElementById('youtubeLink').value = lesson.video_url || '';
                document.getElementById('lessonTheory').value = lesson.theory_md || '';
                if (lesson.course_id) {
                    document.getElementById('courseSelect').value = lesson.course_id;
                }

                // Load quizzes
                if (lesson.quizzes && lesson.quizzes.length > 0) {
                    lesson.quizzes.forEach((quiz, qi) => {
                        const options = quiz.options || [];
                        const optTexts   = ['', '', '', ''];
                        let correctLabel = 'A';
                        const labels     = ['A','B','C','D'];
                        options.forEach((opt, oi) => {
                            optTexts[oi] = opt.option_text || '';
                            if (opt.is_correct) correctLabel = labels[oi];
                        });
                        window.addQuestionField(quiz.question_text, optTexts, correctLabel);
                    });
                }
            }
        } catch (err) {
            console.error(err);
            showToast('Lỗi khi tải dữ liệu bài học', true);
        }
    }

    // ── Xử lý Upload Video lên Cloudinary ─────────────────
    const btnUpload = document.getElementById('btn-upload-video');
    if (btnUpload) {
        btnUpload.addEventListener('click', async () => {
            const fileInput = document.getElementById('videoFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showToast('⚠️ Vui lòng chọn một file video trước!', true);
                return;
            }

            // 1. Gọi API lấy chữ ký (Signature) từ Backend
            btnUpload.disabled = true;
            btnUpload.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
            
            try {
                const token = localStorage.getItem('token');
                const sigRes = await fetch('http://localhost:3000/api/upload/video-signature', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const sigData = await sigRes.json();
                
                if (!sigData.success) throw new Error('Không thể kết nối Server Cloudinary');

                // 2. Gửi trực tiếp lên Cloudinary
                const formData = new FormData();
                formData.append('file', file);
                formData.append('api_key', sigData.apiKey);
                formData.append('timestamp', sigData.timestamp);
                formData.append('signature', sigData.signature);
                formData.append('folder', 'courses_videos');

                const progressContainer = document.getElementById('upload-progress-container');
                const progressBar = document.getElementById('upload-progress-bar');
                const progressText = document.getElementById('upload-progress-text');
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                progressText.textContent = '0%';

                const xhr = new XMLHttpRequest();
                xhr.open('POST', `https://api.cloudinary.com/v1_1/${sigData.cloudName}/video/upload`, true);

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = percent + '%';
                        progressText.textContent = percent + '%';
                    }
                };

                xhr.onload = () => {
                    btnUpload.disabled = false;
                    btnUpload.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Tải lên';
                    
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        document.getElementById('youtubeLink').value = response.secure_url;
                        showToast('✅ Upload video lên Cloudinary thành công!');
                    } else {
                        showToast('❌ Lỗi upload: ' + xhr.responseText, true);
                    }
                };

                xhr.onerror = () => {
                    btnUpload.disabled = false;
                    btnUpload.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Tải lên';
                    showToast('❌ Lỗi kết nối mạng khi tải video!', true);
                };

                xhr.send(formData);
                
            } catch (err) {
                console.error(err);
                btnUpload.disabled = false;
                btnUpload.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Tải lên';
                showToast('❌ ' + err.message, true);
            }
        });
    }

    // ── Lưu bài học ──────────────────────────────────────
    document.getElementById('btn-save-lesson').addEventListener('click', async () => {
        const lessonName = document.getElementById('lessonName').value.trim();
        const courseId   = document.getElementById('courseSelect').value;
        const videoUrl   = document.getElementById('youtubeLink').value.trim();

        if (!lessonName) { showToast('⚠️ Vui lòng nhập tên bài học!', true); return; }
        if (!courseId)   { showToast('⚠️ Vui lòng chọn khóa học!', true); return; }

        // Collect quizzes
        let hasQuizError = false;
        const quizzes = [];
        const blocks = document.querySelectorAll('#quizContainer .question-block');
        
        for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            const questionText = block.querySelector('.question-text').value.trim();
            if (!questionText) continue;

            const opts = Array.from(block.querySelectorAll('.option')).map(opt => opt.value.trim());
            
            // Check if any option is empty
            if (opts.some(opt => !opt)) {
                hasQuizError = true;
                showToast(`⚠️ Vui lòng nhập đầy đủ 4 đáp án cho Câu ${i + 1}!`, true);
                break;
            }

            const correctLabel = block.querySelector('.correct-answer').value;
            const labels = ['A','B','C','D'];
            quizzes.push({
                question_text: questionText,
                options: labels.map((lbl, idx) => ({
                    option_text: opts[idx],
                    is_correct: lbl === correctLabel ? 1 : 0
                }))
            });
        }

        if (hasQuizError) return;

        const payload = { 
            course_id: courseId, 
            title: lessonName, 
            video_url: videoUrl, 
            theory_md: document.getElementById('lessonTheory').value.trim(),
            quizzes 
        };

        const btn = document.getElementById('btn-save-lesson');
        btn.disabled   = true;
        btn.classList.add('opacity-70');

        let res;
        if (isEditing) {
            res = await window.updateLesson(lessonId, payload);
        } else {
            res = await window.createLesson(payload);
        }

        btn.disabled  = false;
        btn.classList.remove('opacity-70');

        if (res.success) {
            showToast(isEditing ? '✅ Cập nhật bài học thành công!' : '✅ Tạo bài học thành công!');
            
            // Cập nhật state toàn cục để trang danh sách biết hiển thị khóa học nào
            const select = document.getElementById('courseSelect');
            window.selectedCourseId    = courseId;
            window.selectedCourseTitle = select.options[select.selectedIndex].text;

            window.editingLessonId = null;
            setTimeout(() => window.loadPage('danh-sach-bai-hoc.html'), 1200);
        } else {
            showToast('❌ ' + (res.message || 'Lỗi không xác định!'), true);
        }
    });

    // ── Nút quay lại ─────────────────────────────────────
    document.getElementById('btn-back-to-lessons').addEventListener('click', () => {
        window.editingLessonId = null;
        window.loadPage('danh-sach-bai-hoc.html');
    });
})();
</script>
