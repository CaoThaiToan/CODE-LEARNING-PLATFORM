<div class="content-header">
    <div class="header-titles">
        <h1 class="main-title">QUẢN LÝ KHÓA HỌC</h1>
        <p class="sub-title">Xem, chỉnh sửa và xóa các khóa học hiện có.</p>
    </div>
    <button class="btn-add-shortcut" id="btn-add-course">
        <i class="fa-solid fa-circle-plus"></i> Thêm mới
    </button>
</div>

<!-- Thông báo toast -->
<div id="ds-toast" class="admin-toast"></div>

<div class="course-list-container" id="course-list-container">
    <!-- Danh sách sẽ được render động -->
    <div class="admin-loading">
        <i class="fa-solid fa-spinner fa-spin"></i> Đang tải danh sách khóa học...
    </div>
</div>

<script>
(async function initCourseList() {
    const container = document.getElementById('course-list-container');
    const toast     = document.getElementById('ds-toast');


    // ── Helper: Hiện toast thông báo ────────────────────────
    function showToast(msg, isError = false) {
        toast.textContent = msg;
        toast.className = 'admin-toast';
        toast.style.background = isError ? '#ef4444' : '#10b981';
        toast.classList.remove('display-none');
        setTimeout(() => { toast.classList.add('display-none'); }, 3000);
    }

    // ── Helper: Render HTML cho 1 thẻ khóa học ──────────────
    function renderCard(course) {
        const thumb = course.thumbnail_url
            ? course.thumbnail_url
            : 'Public/images/img_TrangChu.png';

        const priceTag = course.price > 0
            ? `<span class="mock-tag tag-vip-gold">VIP – ${Number(course.price).toLocaleString('vi-VN')} ₫</span>`
            : `<span class="mock-tag">Miễn phí</span>`;

        const statusTag = course.status === 'published'
            ? `<span class="mock-tag tag-success">Đã xuất bản</span>`
            : `<span class="mock-tag tag-muted">Nháp</span>`;

        const levelMap = {
            'coban': 'Cơ bản',
            'trungcap': 'Trung cấp',
            'nangcao': 'Nâng cao',
            'thietke': 'Thiết kế',
            'Cơ bản': 'Cơ bản',
            'Trung cấp': 'Trung cấp',
            'Nâng cao': 'Nâng cao',
            'Thiết kế': 'Thiết kế'
        };
        const levelLabel = course.level ? (levelMap[course.level] || course.level) : null;
        const levelTag = levelLabel
            ? `<span class="mock-tag tag-level">Mức độ: ${levelLabel}</span>`
            : '';

        return `
        <div class="course-item-card" data-id="${course.id}">
            <div class="course-thumb">
                <img src="${thumb}" alt="${course.title}" onerror="this.onerror=null; this.src='Public/images/img_TrangChu.png';">
            </div>
            <div class="course-info">
                <h3>${course.title}</h3>
                <p>${course.description || 'Chưa có mô tả.'}</p>
                <div class="course-tags-wrapper">
                    ${priceTag}
                    ${levelTag}
                    ${statusTag}
                </div>
            </div>
            <div class="course-hover-actions">
                <button class="act-btn lessons-btn" title="Quản lý bài học" data-action="lessons" data-id="${course.id}" data-title="${course.title}">
                    <i class="fa-solid fa-book-open"></i>
                </button>
                <button class="act-btn edit-btn" title="Chỉnh sửa" data-action="edit" data-id="${course.id}">
                    <i class="fa-regular fa-pen-to-square"></i>
                </button>
                <button class="act-btn delete-btn" title="Xóa" data-action="delete" data-id="${course.id}">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>
        </div>`;
    }

    // ── Helper: Render toàn bộ danh sách ────────────────────
    async function renderList() {
        container.innerHTML = `<div class="admin-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div>`;

        const courses = await window.loadCourses();

        if (!courses || courses.length === 0) {
            container.innerHTML = `
                <div class="admin-empty-state">
                    <i class="fa-solid fa-box-open"></i>
                    <p>Chưa có khóa học nào. Hãy thêm mới!</p>
                </div>`;
            return;
        }

        container.innerHTML = courses.map(renderCard).join('');

        // Gắn sự kiện sau khi đã render xong
        container.querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id     = btn.getAttribute('data-id');
                const action = btn.getAttribute('data-action');

                if (action === 'lessons') {
                    window.selectedCourseId    = id;
                    window.selectedCourseTitle = btn.getAttribute('data-title');
                    window.loadPage('danh-sach-bai-hoc.html');
                }

                if (action === 'delete') {
                    if (window.showConfirmDialog) {
                        window.showConfirmDialog({
                            title: 'Xóa khóa học',
                            message: 'Bạn có chắc muốn xóa khóa học này không? Hành động này không thể hoàn tác!',
                            icon: 'fa-trash-can',
                            confirmText: 'Xóa',
                            onConfirm: async () => {
                                const res = await window.deleteCourse(id);
                                if (res.success) {
                                    showToast('✅ Xóa khóa học thành công!');
                                    await renderList();
                                } else {
                                    showToast('❌ ' + (res.message || 'Xóa thất bại!'), true);
                                }
                            }
                        });
                    } else {
                        if (!confirm('Bạn có chắc muốn xóa khóa học này không?\nHành động này không thể hoàn tác!')) return;
                        const res = await window.deleteCourse(id);
                        if (res.success) {
                            showToast('✅ Xóa khóa học thành công!');
                            await renderList();
                        } else {
                            showToast('❌ ' + (res.message || 'Xóa thất bại!'), true);
                        }
                    }
                }

                if (action === 'edit') {
                    window.editingCourseId = id;
                    window.loadPage('them-kh.html');
                }
            });
        });
    }

    // ── Nút Thêm mới ──────────────────────────────────────
    document.getElementById('btn-add-course').addEventListener('click', () => {
        window.editingCourseId = null;
        window.loadPage('them-kh.html');
    });

    // ── Khởi chạy ─────────────────────────────────────────
    renderList();
})();
</script>
