<div class="content-header">
    <div class="header-titles">
        <h1 class="main-title">QUẢN LÝ NGƯỜI DÙNG</h1>
        <p class="sub-title">Danh sách tất cả tài khoản đã đăng ký trên hệ thống.</p>
    </div>
    <div id="user-count-badge" class="user-count-badge display-none">
        👥 <span id="user-count-text">0</span> tài khoản
    </div>
</div>

<!-- Toast -->
<div id="user-toast" class="admin-toast"></div>

<!-- Table container -->
<div class="user-table-container" id="user-table-wrapper">
    <div class="admin-loading">
        <i class="fa-solid fa-spinner fa-spin"></i> Đang tải danh sách người dùng...
    </div>
</div>

<!-- ── MODAL XEM KHÓA HỌC ─────────────────────────────── -->
<div id="modal-courses" class="modal-overlay">
    <div class="modal-content">
        <button onclick="closeModal('modal-courses')" class="modal-close-btn">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h2 id="modal-courses-title" class="font-size-18 text-purple-indigo mb-6"></h2>
        <p id="modal-courses-email" class="font-size-13 text-muted mb-24"></p>
        <div id="modal-courses-body"></div>
    </div>
</div>

<!-- ── MODAL XÓA TÀI KHOẢN ───────────────────────────── -->
<div id="modal-delete" class="modal-overlay">
    <div class="modal-content delete-modal-content">
        <button onclick="closeModal('modal-delete')" class="modal-close-btn">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="text-center mb-20">
            <div class="delete-icon-box">
                <i class="fa-solid fa-user-slash font-size-24 text-error"></i>
            </div>
            <h2 class="font-size-20 font-800 text-main mb-6">Xóa tài khoản</h2>
            <p id="delete-modal-username" class="font-size-14 text-desc"></p>
        </div>
        <div class="mb-20">
            <label class="font-700 font-size-14 text-main block mb-8">
                Lý do xóa tài khoản <span class="text-error">*</span>
            </label>
            <textarea id="delete-reason-input" class="delete-textarea" rows="3" placeholder="Ví dụ: Vi phạm điều khoản sử dụng, spam nội dung, ..."></textarea>
            <p id="delete-reason-err" class="text-error font-size-12 mt-4 display-none">Vui lòng nhập lý do xóa!</p>
        </div>
        <div class="flex gap-12">
            <button onclick="closeModal('modal-delete')" class="btn-cancel-modal">
                Hủy bỏ
            </button>
            <button id="confirm-delete-btn" onclick="confirmDeleteUser()" class="btn-confirm-delete">
                <i class="fa-solid fa-trash-can"></i> Xác nhận xóa
            </button>
        </div>
    </div>
</div>

<script>
let deletingUserId = null;

function closeModal(id) {
    document.getElementById(id).classList.add('display-none');
    document.getElementById(id).style.display = 'none'; // Keep for compatibility if needed
}

// ── Màu avatar ngẫu nhiên ──────────────────────────────────
const avColors = ['av-purple','av-blue','av-green','av-orange','av-pink'];
function getAvClass(id) { return avColors[id % avColors.length]; }

// ── Toast ──────────────────────────────────────────────────
function showUserToast(msg, isError = false) {
    if (window.showGlobalToast) {
        window.showGlobalToast(msg, isError ? 'error' : 'success');
    } else {
        const toast = document.getElementById('user-toast');
        if (toast) {
            toast.textContent = msg;
            toast.className = 'admin-toast';
            toast.style.background = isError ? '#ef4444' : '#10b981';
            toast.classList.remove('display-none');
            setTimeout(() => toast.classList.add('display-none'), 3000);
        } else {
            alert(msg);
        }
    }
}

// ── Render table ───────────────────────────────────────────
function renderRow(user) {
    const initial = (user.full_name || user.username || '?')[0].toUpperCase();
    const avClass = getAvClass(user.id);
    const isDeleted = user.is_deleted;

    const roleBadge = user.role === 'Admin'
        ? `<span class="role-badge badge-admin"><i class="fa-solid fa-crown font-size-10"></i> Admin</span>`
        : isDeleted
            ? `<span class="role-badge badge-deleted"><i class="fa-solid fa-ban font-size-10"></i> Đã xóa</span>`
            : `<span class="role-badge badge-user"><i class="fa-solid fa-user font-size-10"></i> User</span>`;

    const joinDate = user.created_at
        ? new Date(user.created_at).toLocaleDateString('vi-VN')
        : '—';

    const actions = isDeleted
        ? `<td class="text-center">
                <span class="btn-deleted-tag" title="${user.delete_reason || ''}">🚫 Đã xóa</span>
           </td>`
        : `<td class="text-center">
                <button class="user-act-btn btn-view-user" title="Xem khóa học đã đăng ký"
                    onclick="openUserCourses(${user.id}, '${(user.full_name||user.username).replace(/'/g,"\\'")}', '${user.email}')">
                    <i class="fa-regular fa-eye"></i>
                </button>
                <button class="user-act-btn btn-delete-user ml-6" title="Xóa tài khoản"
                     onclick="openDeleteModal(${user.id}, '${(user.full_name||user.username).replace(/'/g,"\\'")}')">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
           </td>`;

    return `
    <tr data-user-id="${user.id}">
        <td>
            <div class="flex items-center gap-12">
                <div class="user-avatar ${avClass}">${initial}</div>
                <div>
                    <div class="font-600 text-main font-size-14">${user.full_name || user.username}</div>
                    <div class="font-size-12 text-muted">@${user.username}</div>
                </div>
            </div>
        </td>
        <td class="font-size-14 text-indigo-light">${user.email}</td>
        <td>${roleBadge}</td>
        <td class="font-size-13 text-muted">${joinDate}</td>
        ${actions}
    </tr>`;
}

// ── Mở modal xem khóa học ─────────────────────────────────
async function openUserCourses(userId, name, email) {
    document.getElementById('modal-courses-title').textContent = '📚 Khóa học của ' + name;
    document.getElementById('modal-courses-email').textContent = email;
    document.getElementById('modal-courses-body').innerHTML = `
        <div class="admin-loading">
            <i class="fa-solid fa-spinner fa-spin"></i> Đang tải...
        </div>`;
    const modal = document.getElementById('modal-courses');
    modal.classList.remove('display-none');
    modal.style.display = 'flex';

    try {
        const token = localStorage.getItem('token');
        const res = await fetch(`http://localhost:3000/api/users/${userId}/courses`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (!data.success) {
            document.getElementById('modal-courses-body').innerHTML = `<p class="text-error">❌ ${data.message}</p>`;
            return;
        }

        const courses = data.data;
        if (!courses || courses.length === 0) {
            document.getElementById('modal-courses-body').innerHTML = `
                <div class="admin-empty-state">
                    <i class="fa-solid fa-book-open"></i>
                    <p>Người dùng chưa đăng ký khóa học nào.</p>
                </div>`;
            return;
        }

        const freeCount = courses.filter(c => !c.price || c.price == 0).length;
        const vipCount  = courses.filter(c => c.price > 0).length;

        let html = `
            <div class="flex gap-10 mb-18 flex-wrap">
                <span class="enrolled-count">📗 ${freeCount} Miễn phí</span>
                <span class="vip-count">👑 ${vipCount} VIP</span>
                <span class="badge-count-gray">Tổng: ${courses.length} khóa học</span>
            </div>`;

        courses.forEach(c => {
            const thumb   = c.thumbnail_url || 'Public/images/img_TrangChu.png';
            const isVip   = c.price > 0;
            const progress = c.progress_percent || 0;
            const validUntil = c.valid_until ? new Date(c.valid_until).toLocaleDateString('vi-VN') : null;
            html += `
            <div class="course-card-mini">
                <img src="${thumb}" alt="${c.title}" onerror="this.src='Public/images/img_TrangChu.png';">
                <div class="flex-1 shrink-0-min-0">
                    <h4>${c.title}</h4>
                    <p>
                        ${isVip
                            ? `<span class="vip-count">👑 VIP – ${Number(c.price).toLocaleString('vi-VN')} ₫</span>`
                            : `<span class="enrolled-count">📗 Miễn phí</span>`}
                        ${validUntil ? `• Hạn đến: ${validUntil}` : ''}
                    </p>
                </div>
                <div class="text-center shrink-0">
                    <div class="font-size-16 font-800 text-purple-main">${progress}%</div>
                    <div class="font-size-11 text-muted">tiến độ</div>
                </div>
            </div>`;
        });

        document.getElementById('modal-courses-body').innerHTML = html;
    } catch (err) {
        document.getElementById('modal-courses-body').innerHTML = `<p class="text-error">❌ Lỗi kết nối!</p>`;
    }
}

// ── Mở modal xóa ──────────────────────────────────────────
function openDeleteModal(userId, name) {
    deletingUserId = userId;
    document.getElementById('delete-modal-username').textContent = `Bạn đang xóa tài khoản: ${name}`;
    document.getElementById('delete-reason-input').value = '';
    const errEl = document.getElementById('delete-reason-err');
    errEl.classList.add('display-none');
    errEl.style.display = 'none';
    const modal = document.getElementById('modal-delete');
    modal.classList.remove('display-none');
    modal.style.display = 'flex';
    setTimeout(() => document.getElementById('delete-reason-input').focus(), 100);
}

// ── Xác nhận xóa ──────────────────────────────────────────
async function confirmDeleteUser() {
    const reason = document.getElementById('delete-reason-input').value.trim();
    if (!reason) {
        const errEl = document.getElementById('delete-reason-err');
        errEl.classList.remove('display-none');
        errEl.style.display = 'block';
        return;
    }
    const errEl = document.getElementById('delete-reason-err');
    errEl.classList.add('display-none');
    errEl.style.display = 'none';

    const btn = document.getElementById('confirm-delete-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xóa...';

    try {
        const token = localStorage.getItem('token');
        const res = await fetch(`http://localhost:3000/api/users/${deletingUserId}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ reason })
        });
        const data = await res.json();

        if (data.success) {
            closeModal('modal-delete');
            showUserToast('✅ Đã xóa tài khoản thành công!');
            await renderUserTable();
        } else {
            showUserToast('❌ ' + (data.message || 'Xóa thất bại!'), true);
        }
    } catch {
        showUserToast('❌ Lỗi kết nối!', true);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-trash-can"></i> Xác nhận xóa';
    }
}

// ── Render bảng ───────────────────────────────────────────
async function renderUserTable() {
    const wrapper = document.getElementById('user-table-wrapper');
    wrapper.innerHTML = `<div class="admin-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div>`;

    try {
        const token = localStorage.getItem('token');
        const res  = await fetch('http://localhost:3000/api/users', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (!data.success) {
            wrapper.innerHTML = `<div class="admin-loading text-error">❌ ${data.message}</div>`;
            return;
        }

        const users = data.data;

        // Update badge
        const badge = document.getElementById('user-count-badge');
        badge.classList.remove('display-none');
        badge.style.display = 'block';
        document.getElementById('user-count-text').textContent = users.length;

        if (users.length === 0) {
            wrapper.innerHTML = `<div class="admin-empty-state">Chưa có người dùng nào.</div>`;
            return;
        }

        wrapper.innerHTML = `
        <table class="user-table">
            <thead>
                <tr>
                    <th>NGƯỜI DÙNG</th>
                    <th>EMAIL</th>
                    <th>VAI TRÒ</th>
                    <th>NGÀY THAM GIA</th>
                    <th class="text-center">THAO TÁC</th>
                </tr>
            </thead>
            <tbody>${users.map(renderRow).join('')}</tbody>
        </table>`;
    } catch {
        wrapper.innerHTML = `<div class="admin-loading text-error">❌ Không thể kết nối đến server!</div>`;
    }
}

renderUserTable();
</script>
