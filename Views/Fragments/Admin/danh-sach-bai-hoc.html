<div class="content-header">
    <div class="header-titles">
        <div style="display:flex; align-items:center; gap:12px;">
            <button id="btn-back-courses" class="act-btn" title="Quay lại danh sách khóa học"
                style="width:auto; padding:8px 16px; border-radius:10px; background:#f1f5f9; color:#4a5568; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </button>
            <div>
                <h1 class="main-title" id="course-lessons-title">QUẢN LÝ BÀI HỌC</h1>
                <p class="sub-title" id="course-lessons-sub">Xem và quản lý các bài học trong khóa học.</p>
            </div>
        </div>
    </div>
    <button class="btn-add-shortcut" id="btn-add-lesson">
        <i class="fa-solid fa-circle-plus"></i> Thêm bài học
    </button>
</div>

<!-- Toast -->
<div id="lesson-toast" style="display:none; background:#10b981; color:#fff; padding:12px 22px; border-radius:12px; margin-bottom:20px; font-weight:600; font-size:14px;"></div>

<div class="lesson-list-container" id="lesson-list-container">
    <div style="padding:60px; text-align:center; color:#7c3aed; font-size:16px;">
        <i class="fa-solid fa-spinner fa-spin"></i> Đang tải danh sách bài học...
    </div>
</div>

<!-- Modal xem video -->
<div id="video-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:20px; padding:30px; max-width:800px; width:90%; position:relative;">
        <button id="close-video-modal" style="position:absolute; top:15px; right:15px; background:#fee2e2; color:#ef4444; border:none; width:36px; height:36px; border-radius:10px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h3 id="modal-lesson-title" style="margin-bottom:20px; color:#2d1b81; font-size:18px;"></h3>
        <div style="position:relative; padding-bottom:56.25%; height:0; border-radius:12px; overflow:hidden; background:#000;">
            <iframe id="modal-video-frame" src="" frameborder="0" allowfullscreen
                style="position:absolute; top:0; left:0; width:100%; height:100%;"></iframe>
        </div>
    </div>
</div>

<style>
.lesson-list-container { display:flex; flex-direction:column; gap:16px; }

.lesson-item-card {
    background:#fff;
    border-radius:20px;
    border:1px solid #edf2f7;
    padding:20px 25px;
    display:flex;
    align-items:center;
    gap:20px;
    position:relative;
    transition:0.3s;
    cursor:default;
}
.lesson-item-card:hover { box-shadow:0 6px 24px rgba(109,40,217,0.08); border-color:#c4b5fd; }

.lesson-order-badge {
    min-width:42px; height:42px;
    background:linear-gradient(135deg,#8b5cf6,#6d28d9);
    color:#fff; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; flex-shrink:0;
}
.lesson-info { flex:1; min-width:0; }
.lesson-info h3 { font-size:16px; color:#1a202c; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lesson-info p { font-size:13px; color:#94a3b8; }
.lesson-type-tag { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }

.lesson-actions { display:flex; gap:8px; flex-shrink:0; }
.lesson-actions .act-btn { width:36px; height:36px; border-radius:10px; border:none; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.2s; }
.lesson-actions .act-btn:hover { transform:scale(1.1); }
.watch-btn { background:#f0f7ff; color:#3b82f6; }
.edit-lesson-btn { background:#f0fdf4; color:#16a34a; }
.delete-lesson-btn { background:#fff5f5; color:#ef4444; }

.lessons-btn { background:#f5f3ff; color:#7c3aed; }
</style>

<script>
(async function initLessonList() {
    const container = document.getElementById('lesson-list-container');
    const toast     = document.getElementById('lesson-toast');
    const courseId  = window.selectedCourseId;
    const courseTitle = window.selectedCourseTitle || 'Khóa học';

    // Update header
    document.getElementById('course-lessons-title').textContent = 'BÀI HỌC: ' + courseTitle.toUpperCase();
    document.getElementById('course-lessons-sub').textContent = 'Quản lý các bài học trong khóa học "' + courseTitle + '"';

    function showToast(msg, isError = false) {
        toast.textContent = msg;
        toast.style.background = isError ? '#ef4444' : '#10b981';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function getYouTubeEmbedUrl(url) {
        if (!url) return '';
        const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
        return match ? `https://www.youtube.com/embed/${match[1]}` : url;
    }

    function getTypeTag(lesson) {
        if (lesson.content_type === 'video') {
            return `<span class="lesson-type-tag" style="background:#eff6ff;color:#3b82f6;"><i class="fa-brands fa-youtube"></i> Video</span>`;
        }
        return `<span class="lesson-type-tag" style="background:#f0fdf4;color:#16a34a;"><i class="fa-solid fa-book"></i> Lý thuyết</span>`;
    }

    function renderLesson(lesson, index) {
        const hasVideo = lesson.video_url;
        return `
        <div class="lesson-item-card" data-id="${lesson.id}">
            <div class="lesson-order-badge">${index + 1}</div>
            <div class="lesson-info">
                <h3>${lesson.title}</h3>
                <p>${getTypeTag(lesson)} ${hasVideo ? '• Có video' : '• Không có video'}</p>
            </div>
            <div class="lesson-actions">
                ${hasVideo ? `
                <button class="act-btn watch-btn" title="Xem video" data-lesson-id="${lesson.id}" data-action="watch"
                    data-video="${lesson.video_url}" data-title="${lesson.title}">
                    <i class="fa-solid fa-play"></i>
                </button>` : ''}
                <button class="act-btn edit-lesson-btn" title="Chỉnh sửa bài học" data-lesson-id="${lesson.id}" data-action="edit-lesson">
                    <i class="fa-regular fa-pen-to-square"></i>
                </button>
                <button class="act-btn delete-lesson-btn" title="Xóa bài học" data-lesson-id="${lesson.id}" data-action="delete-lesson">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>
        </div>`;
    }

    async function renderList() {
        container.innerHTML = `<div style="padding:60px;text-align:center;color:#7c3aed;"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div>`;
        if (!courseId) {
            container.innerHTML = `<div style="padding:60px;text-align:center;color:#ef4444;">❌ Không tìm thấy khóa học. Hãy quay lại và chọn khóa học.</div>`;
            return;
        }
        const lessons = await window.getLessonsByCourse(courseId);
        if (!lessons || lessons.length === 0) {
            container.innerHTML = `
                <div style="padding:80px;text-align:center;color:#94a3b8;">
                    <i class="fa-solid fa-book-open" style="font-size:48px;margin-bottom:16px;display:block;"></i>
                    <p style="font-size:16px;font-weight:600;">Chưa có bài học nào. Hãy thêm bài học đầu tiên!</p>
                </div>`;
            return;
        }
        container.innerHTML = lessons.map((l, i) => renderLesson(l, i)).join('');

        // Attach events
        container.querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const action   = btn.getAttribute('data-action');
                const lessonId = btn.getAttribute('data-lesson-id');

                if (action === 'watch') {
                    const title     = btn.getAttribute('data-title');
                    const videoUrl  = btn.getAttribute('data-video');
                    const embedUrl  = getYouTubeEmbedUrl(videoUrl);
                    document.getElementById('modal-lesson-title').textContent = title;
                    document.getElementById('modal-video-frame').src = embedUrl;
                    const modal = document.getElementById('video-modal');
                    modal.style.display = 'flex';
                }

                if (action === 'edit-lesson') {
                    window.editingLessonId = lessonId;
                    window.loadPage('them-vd.html');
                }

                if (action === 'delete-lesson') {
                    if (window.showConfirmDialog) {
                        window.showConfirmDialog({
                            title: 'Xóa bài học',
                            message: 'Bạn có chắc muốn xóa bài học này? Hành động này không thể hoàn tác!',
                            icon: 'fa-trash-can',
                            confirmText: 'Xóa',
                            onConfirm: async () => {
                                const res = await window.deleteLesson(lessonId);
                                if (res.success) {
                                    showToast('✅ Xóa bài học thành công!');
                                    await renderList();
                                } else {
                                    showToast('❌ ' + (res.message || 'Xóa thất bại!'), true);
                                }
                            }
                        });
                    } else {
                        if (!confirm('Bạn có chắc muốn xóa bài học này?\nHành động này không thể hoàn tác!')) return;
                        const res = await window.deleteLesson(lessonId);
                        if (res.success) {
                            showToast('✅ Xóa bài học thành công!');
                            await renderList();
                        } else {
                            showToast('❌ ' + (res.message || 'Xóa thất bại!'), true);
                        }
                    }
                }
            });
        });
    }

    // Modal close
    document.getElementById('close-video-modal').addEventListener('click', () => {
        document.getElementById('video-modal').style.display = 'none';
        document.getElementById('modal-video-frame').src = '';
    });

    // Nút Thêm bài học
    document.getElementById('btn-add-lesson').addEventListener('click', () => {
        window.editingLessonId = null;
        window.loadPage('them-vd.html');
    });

    // Nút Quay lại
    document.getElementById('btn-back-courses').addEventListener('click', () => {
        window.loadPage('danh-sach-kh.html');
    });

    renderList();
})();
</script>
