<div class="content-header">
    <div class="header-titles">
        <div class="flex items-center gap-12">
            <button id="btn-back-courses" class="btn-secondary-admin" title="Quay lại danh sách khóa học">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </button>
            <div>
                <h1 class="main-title" id="course-lessons-title">QUẢN LÝ BÀI HỌC</h1>
                <p class="sub-title" id="course-lessons-sub">Xem và quản lý các bài học trong khóa học.</p>
            </div>
        </div>
    </div>
    <button class="btn-add-shortcut" id="btn-add-lesson">
        <i class="fa-solid fa-circle-plus"></i> Thêm bài học
    </button>
</div>

<!-- Toast -->
<div id="lesson-toast" class="admin-toast display-none"></div>

<div class="lesson-list-container" id="lesson-list-container">
    <div class="admin-loading">
        <i class="fa-solid fa-spinner fa-spin"></i> Đang tải danh sách bài học...
    </div>
</div>

<!-- Modal xem video -->
<div id="video-modal" class="modal-admin display-none">
    <div class="modal-admin-content">
        <button id="close-video-modal" class="btn-close-modal">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h3 id="modal-lesson-title" class="form-title"></h3>
        <div class="video-responsive-wrapper">
            <iframe id="modal-video-frame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>
</div>

<script>
(async function initLessonList() {
    const container = document.getElementById('lesson-list-container');
    const toast     = document.getElementById('lesson-toast');
    const courseId  = window.selectedCourseId;
    const courseTitle = window.selectedCourseTitle || 'Khóa học';

    // Update header
    document.getElementById('course-lessons-title').textContent = 'BÀI HỌC: ' + courseTitle.toUpperCase();
    document.getElementById('course-lessons-sub').textContent = 'Quản lý các bài học trong khóa học "' + courseTitle + '"';

    function showToast(msg, isError = false) {
        toast.textContent = msg;
        toast.style.background = isError ? '#ef4444' : '#10b981';
        toast.classList.remove('display-none');
        setTimeout(() => { toast.classList.add('display-none'); }, 3000);
    }

    function getYouTubeEmbedUrl(url) {
        if (!url) return '';
        const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
        return match ? `https://www.youtube.com/embed/${match[1]}` : url;
    }

    function getTypeTag(lesson) {
        if (lesson.content_type === 'video') {
            return `<span class="lesson-type-tag tag-video"><i class="fa-brands fa-youtube"></i> Video</span>`;
        }
        return `<span class="lesson-type-tag tag-theory"><i class="fa-solid fa-book"></i> Lý thuyết</span>`;
    }

    function renderLesson(lesson, index) {
        const hasVideo = lesson.video_url;
        return `
        <div class="lesson-item-card" data-id="${lesson.id}">
            <div class="lesson-order-badge">${index + 1}</div>
            <div class="lesson-info">
                <h3>${lesson.title}</h3>
                <p>${getTypeTag(lesson)} ${hasVideo ? '• Có video' : '• Không có video'}</p>
            </div>
            <div class="lesson-actions">
                ${hasVideo ? `
                <button class="act-btn watch-btn" title="Xem video" data-lesson-id="${lesson.id}" data-action="watch"
                    data-video="${lesson.video_url}" data-title="${lesson.title}">
                    <i class="fa-solid fa-play"></i>
                </button>` : ''}
                <button class="act-btn edit-lesson-btn" title="Chỉnh sửa bài học" data-lesson-id="${lesson.id}" data-action="edit-lesson">
                    <i class="fa-regular fa-pen-to-square"></i>
                </button>
                <button class="act-btn delete-lesson-btn" title="Xóa bài học" data-lesson-id="${lesson.id}" data-action="delete-lesson">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>
        </div>`;
    }

    async function renderList() {
        container.innerHTML = `<div class="padding-60 text-center text-purple-main"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div>`;
        if (!courseId) {
            container.innerHTML = `<div class="admin-empty-state">❌ Không tìm thấy khóa học. Hãy quay lại và chọn khóa học.</div>`;
            return;
        }
        const lessons = await window.getLessonsByCourse(courseId);
        if (!lessons || lessons.length === 0) {
            container.innerHTML = `
                <div class="admin-empty-state">
                    <i class="fa-solid fa-book-open font-size-48 mb-16 block"></i>
                    <p class="font-size-16 font-600">Chưa có bài học nào. Hãy thêm bài học đầu tiên!</p>
                </div>`;
            return;
        }
        container.innerHTML = lessons.map((l, i) => renderLesson(l, i)).join('');

        // Attach events
        container.querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const action   = btn.getAttribute('data-action');
                const lessonId = btn.getAttribute('data-lesson-id');

                if (action === 'watch') {
                    const title     = btn.getAttribute('data-title');
                    const videoUrl  = btn.getAttribute('data-video');
                    const embedUrl  = getYouTubeEmbedUrl(videoUrl);
                    document.getElementById('modal-lesson-title').textContent = title;
                    document.getElementById('modal-video-frame').src = embedUrl;
                    const modal = document.getElementById('video-modal');
                    modal.classList.remove('display-none');
                    modal.style.display = 'flex';
                }

                if (action === 'edit-lesson') {
                    window.editingLessonId = lessonId;
                    window.loadPage('them-vd.html');
                }

                if (action === 'delete-lesson') {
                    if (window.showConfirmDialog) {
                        window.showConfirmDialog({
                            title: 'Xóa bài học',
                            message: 'Bạn có chắc muốn xóa bài học này? Hành động này không thể hoàn tác!',
                            icon: 'fa-trash-can',
                            confirmText: 'Xóa',
                            onConfirm: async () => {
                                const res = await window.deleteLesson(lessonId);
                                if (res.success) {
                                    showToast('✅ Xóa bài học thành công!');
                                    await renderList();
                                } else {
                                    showToast('❌ ' + (res.message || 'Xóa thất bại!'), true);
                                }
                            }
                        });
                    } else {
                        if (!confirm('Bạn có chắc muốn xóa bài học này?\nHành động này không thể hoàn tác!')) return;
                        const res = await window.deleteLesson(lessonId);
                        if (res.success) {
                            showToast('✅ Xóa bài học thành công!');
                            await renderList();
                        } else {
                            showToast('❌ ' + (res.message || 'Xóa thất bại!'), true);
                        }
                    }
                }
            });
        });
    }

    // Modal close
    document.getElementById('close-video-modal').addEventListener('click', () => {
        const modal = document.getElementById('video-modal');
        modal.classList.add('display-none');
        modal.style.display = 'none';
        document.getElementById('modal-video-frame').src = '';
    });

    // Nút Thêm bài học
    document.getElementById('btn-add-lesson').addEventListener('click', () => {
        window.editingLessonId = null;
        window.loadPage('them-vd.html');
    });

    // Nút Quay lại
    document.getElementById('btn-back-courses').addEventListener('click', () => {
        window.loadPage('danh-sach-kh.html');
    });

    renderList();
})();
</script>
