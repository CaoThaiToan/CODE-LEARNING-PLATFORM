<div class="form-center">
    <div class="form-container-card">
        <h1 class="form-title" id="form-kh-title">THÊM KHÓA HỌC MỚI</h1>
        <p class="form-subtitle" id="form-kh-subtitle">Khởi tạo một khóa học lập trình mới trên hệ thống.</p>

        <div id="form-toast" class="toast-admin-form display-none"></div>

        <form id="form-kh" autocomplete="off">
            <div class="form-group">
                <label>Loại khóa học</label>
                <select id="courseType" class="form-select" onchange="togglePriceField()">
                    <option value="free">Khóa học thường (Miễn phí)</option>
                    <option value="vip">Khóa học VIP (Có phí)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tên khóa học</label>
                <input id="courseTitle" type="text" placeholder="Ví dụ: Lập trình Web cơ bản (HTML/CSS)" required>
            </div>

            <div class="form-group">
                <label>Mô tả khóa học</label>
                <textarea id="courseDesc" placeholder="Mô tả ngắn gọn về khóa học..."></textarea>
            </div>

            <div class="form-group">
                <label>Hình ảnh khóa học</label>
                <div class="upload-container">
                    <!-- Upload Box -->
                    <div class="upload-box" id="dropzone">
                        <input type="file" id="fileInput" accept="image/*" class="display-none">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p>Kéo thả ảnh vào đây hoặc <b>Nhấp để chọn file</b></p>
                        <span class="font-size-12 text-muted">Hỗ trợ: JPG, PNG, WEBP (Max 5MB)</span>
                    </div>

                    <div class="upload-divider">Hoặc nhập URL</div>

                    <!-- URL Input -->
                    <input id="courseThumbnail" type="text" placeholder="https://...">
                    
                    <!-- Preview Area -->
                    <div class="image-preview-wrapper display-none" id="previewWrapper">
                        <img src="" id="imagePreview">
                        <button type="button" class="btn-remove-preview" id="btnRemovePreview">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Giá chỉ hiện khi chọn VIP -->
            <div id="priceField" class="form-group display-none">
                <label>Giá khóa học VIP (đơn vị: VNĐ)</label>
                <input type="number" id="vipPrice" placeholder="1500000" min="0">
            </div>

            <!-- Mức độ chỉ hiện khi chọn khóa thường -->
            <div id="levelField" class="form-group">
                <label>Mức độ</label>
                <select id="courseLevel" class="form-select">
                    <option value="coban">Cơ bản</option>
                    <option value="trungcap">Trung cấp</option>
                    <option value="nangcao">Nâng cao</option>
                    <option value="thietke">Thiết kế</option>
                </select>
            </div>

            <div class="form-group">
                <label>Trạng thái</label>
                <select id="courseStatus" class="form-select">
                    <option value="draft">Nháp (chưa công khai)</option>
                    <option value="published">Xuất bản (công khai)</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-submit-form" id="btn-submit-kh">
                    <i class="fa-solid fa-check"></i> <span id="btn-label">TẠO KHÓA HỌC NGAY</span>
                </button>
                <button type="button" id="btn-back-list" class="btn-secondary-admin">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách
                </button>
            </div>
        </form>
    </div>
</div>

<script>
(async function initKhoaHocForm() {
    const isEditing  = !!window.editingCourseId;
    const courseId   = window.editingCourseId;
    const toast      = document.getElementById('form-toast');
    const btnLabel   = document.getElementById('btn-label');
    const formTitle  = document.getElementById('form-kh-title');
    const formSub    = document.getElementById('form-kh-subtitle');
    const fileInput  = document.getElementById('fileInput');
    const dropzone   = document.getElementById('dropzone');
    const thumbInput = document.getElementById('courseThumbnail');
    const previewWrp = document.getElementById('previewWrapper');
    const previewImg = document.getElementById('imagePreview');
    const btnRemove  = document.getElementById('btnRemovePreview');

    let selectedFile = null;

    // ── Helper hiện toast ──────────────────────────────────
    function showToast(msg, isError = false) {
        toast.textContent = msg;
        toast.className = 'toast-admin-form';
        toast.style.background = isError ? '#ef4444' : '#10b981';
        toast.classList.remove('display-none');
        setTimeout(() => { toast.classList.add('display-none'); }, 3500);
    }

    // ── Toggle trường Giá VIP và Mức độ ──────────────────────────────
    window.togglePriceField = function() {
        const type = document.getElementById('courseType').value;
        const priceField = document.getElementById('priceField');
        const levelField = document.getElementById('levelField');
        
        if (type === 'vip') {
            priceField.classList.remove('display-none');
            levelField.classList.add('display-none');
        } else {
            priceField.classList.add('display-none');
            levelField.classList.remove('display-none');
        }
    };

    // ── Xử lý chọn File & Preview ─────────────────────────
    dropzone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) handleFileSelection(file);
    });

    // Kéo thả (Drag & Drop)
    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('border-purple-main', 'bg-purple-light');
    });

    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('border-purple-main', 'bg-purple-light');
    });

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) handleFileSelection(file);
    });

    function handleFileSelection(file) {
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewWrp.classList.remove('display-none');
            thumbInput.value = ''; // Xóa URL nếu chọn file
        };
        reader.readAsDataURL(file);
    }

    btnRemove.addEventListener('click', () => {
        selectedFile = null;
        fileInput.value = '';
        previewWrp.classList.add('display-none');
        previewImg.src = '';
    });

    // Nếu nhập URL thì ẩn preview file (hoặc cập nhật preview từ URL)
    thumbInput.addEventListener('input', () => {
        if (thumbInput.value.trim() !== '') {
            selectedFile = null;
            fileInput.value = '';
            previewImg.src = thumbInput.value;
            previewWrp.classList.remove('display-none');
        } else if (!selectedFile) {
            previewWrp.classList.add('display-none');
        }
    });

    // ── Nút quay lại danh sách ────────────────────────────
    document.getElementById('btn-back-list').addEventListener('click', () => {
        window.editingCourseId = null;
        const returnPage = window.defaultCourseType === 'vip' ? 'vip-danh-sach.html' : 'danh-sach-kh.html';
        window.defaultCourseType = null;
        window.loadPage(returnPage);
    });

    // ── Nếu đang Chỉnh sửa: tải dữ liệu cũ vào form ─────
    if (isEditing) {
        formTitle.textContent = 'CHỈNH SỬA KHÓA HỌC';
        formSub.textContent   = 'Cập nhật thông tin khóa học hiện có.';
        btnLabel.textContent  = 'LƯU THAY ĐỔI';
        toast.textContent = '⏳ Đang tải thông tin khóa học...';
        toast.className = 'toast-admin-form bg-purple-main';
        toast.classList.remove('display-none');

        const course = await window.getCourseById(courseId);
        toast.classList.add('display-none');

        if (course) {
            document.getElementById('courseTitle').value     = course.title     || '';
            document.getElementById('courseDesc').value      = course.description || '';
            document.getElementById('courseThumbnail').value = course.thumbnail_url || '';
            document.getElementById('courseStatus').value    = course.status    || 'draft';

            if (course.thumbnail_url) {
                previewImg.src = course.thumbnail_url;
                previewWrp.classList.remove('display-none');
            }

            if (course.price > 0) {
                document.getElementById('courseType').value  = 'vip';
                document.getElementById('vipPrice').value    = course.price;
                document.getElementById('priceField').classList.remove('display-none');
                document.getElementById('levelField').classList.add('display-none');
            } else {
                if (course.level) {
                    document.getElementById('courseLevel').value = course.level;
                }
            }
        } else {
            showToast('❌ Không tìm thấy khóa học!', true);
        }
    } else {
        if (window.defaultCourseType === 'vip') {
            document.getElementById('courseType').value = 'vip';
            window.togglePriceField();
        }
    }

    // ── Xử lý Submit form (Thêm mới HOẶC Cập nhật) ────────
    document.getElementById('btn-submit-kh').addEventListener('click', async () => {
        const title    = document.getElementById('courseTitle').value.trim();
        const desc     = document.getElementById('courseDesc').value.trim();
        const thumb    = document.getElementById('courseThumbnail').value.trim();
        const status   = document.getElementById('courseStatus').value;
        const type     = document.getElementById('courseType').value;
        const level    = document.getElementById('courseLevel').value;
        const priceRaw = document.getElementById('vipPrice').value;
        const price    = type === 'vip' ? (parseFloat(priceRaw) || 0) : 0;

        if (!title) {
            showToast('⚠️ Vui lòng nhập tên khóa học!', true);
            return;
        }

        const btn = document.getElementById('btn-submit-kh');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';

        let finalThumb = thumbInput.value.trim();

        // 1. Nếu có file được chọn -> Upload lên server trước
        if (selectedFile) {
            const formData = new FormData();
            formData.append('image', selectedFile);

            try {
                const uploadRes = await fetch(`${window.API_BASE || 'http://localhost:3000/api'}/upload/image`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                    body: formData
                });
                const uploadData = await uploadRes.json();
                if (uploadData.success) {
                    finalThumb = uploadData.url;
                    // Hiển thị ảnh từ server để xác nhận upload thành công
                    previewImg.src = finalThumb; 
                } else {
                    showToast('❌ Lỗi upload ảnh: ' + uploadData.message, true);
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-check"></i> ${isEditing ? 'LƯU THAY ĐỔI' : 'TẠO KHÓA HỌC NGAY'}`;
                    return;
                }
            } catch (err) {
                showToast('❌ Lỗi kết nối khi upload ảnh!', true);
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-check"></i> ${isEditing ? 'LƯU THAY ĐỔI' : 'TẠO KHÓA HỌC NGAY'}`;
                return;
            }
        }

        const payload = { title, description: desc, thumbnail_url: finalThumb, price, status, level: type === 'free' ? level : null };

        let res;
        if (isEditing) {
            res = await window.updateCourse(courseId, payload);
        } else {
            res = await window.handleAddCourse(payload);
        }

        btn.disabled = false;

        if (res && res.success) {
            showToast(isEditing ? '✅ Cập nhật khóa học thành công!' : '✅ Tạo khóa học thành công!');
            setTimeout(() => {
                window.editingCourseId = null;
                const returnPage = window.defaultCourseType === 'vip' ? 'vip-danh-sach.html' : 'danh-sach-kh.html';
                window.defaultCourseType = null;
                window.loadPage(returnPage);
            }, 1500);
        } else {
            showToast('❌ ' + (res?.message || 'Có lỗi xảy ra. Vui lòng thử lại!'), true);
        }
    });
})();
</script>
