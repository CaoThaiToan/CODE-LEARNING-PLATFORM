<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Elearning Phantom - Access System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="LoginRegister.css">
</head>

<body class="light-off">

    <div class="lamp-wrapper">
        <div class="lamp-container" id="lamp" onclick="toggleLight()">

            <div class="particles-container">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>

            <div class="lamp-shade">
                <div class="lamp-face">
                    <div class="eyes-container">
                        <div class="eye eye-left">
                            <div class="pupil" id="pupil-left"></div>
                        </div>
                        <div class="eye eye-right">
                            <div class="pupil" id="pupil-right"></div>
                        </div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>

            <div class="lamp-stand"></div>

            <div class="lamp-base"></div>
        </div>

        <div class="lamp-glow-floor"></div>

        <span class="lamp-hint">[ click me ]</span>
    </div>

    <div class="main-interface">
        <div class="phantom-bg">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>

            <div class="glass-card">
                <div class="card-header">
                    <div class="logo">
                        <img src="../../public/images/logo_phantom.png" alt="Logo Phantom" class="brand-logo-img">
                        <span class="brand-name">Code Elearning Phantom</span>
                    </div>
                    <p id="form-title">Decrypting Knowledge</p>
                </div>

                <form id="login-form" class="auth-form">
                    <div class="input-group">
                        <i class="fas fa-user-circle"></i>
                        <input id="login-email" type="email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-key"></i>
                        <input id="login-password" type="password" placeholder="Access Code" required>
                    </div>
                    <div id="login-error" style="color:#ef4444;font-size:13px;margin-bottom:8px;display:none;"></div>
                    <button type="submit" class="btn-main" id="login-btn">Access System</button>
                    <div class="form-footer">
                        <p>New Student? <a href="#" onclick="toggleForm(); return false;">Create Identity</a></p>
                    </div>
                </form>

                <form id="signup-form" class="auth-form hidden">
                    <div class="input-group">
                        <i class="fas fa-id-card"></i>
                        <input id="reg-username" type="text" placeholder="Username" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input id="reg-name" type="text" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input id="reg-email" type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input id="reg-password" type="password" placeholder="Secure Password" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input id="reg-confirm" type="password" placeholder="Re-enter Password" required>
                    </div>
                    <div id="reg-error" style="color:#ef4444;font-size:13px;margin-bottom:8px;display:none;"></div>
                    <button type="submit" class="btn-main" id="reg-btn">Begin Journey</button>
                    <div class="form-footer">
                        <p>Already a Member? <a href="#" onclick="toggleForm(); return false;">Login Now</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        /* === KIỂM TRA ĐĂNG NHẬP (TRÁNH BACK LẠI TRANG NÀY) === */
        (function checkAuth() {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('currentUser');
            if (token && userStr) {
                try {
                    const user = JSON.parse(userStr);
                    // Nếu đã đăng nhập, thay thế URL hiện tại bằng trang dashboard
                    window.location.replace(user.role_id === 1 ? 'admin.html' : 'index.html');
                } catch (e) { }
            }
        })();

        /* === BẬT / TẮT ĐÈN === */
        function toggleLight() { document.body.classList.toggle('light-off'); }

        /* === CHUYỂN FORM === */
        function toggleForm() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const title = document.getElementById('form-title');
            loginForm.classList.toggle('hidden');
            signupForm.classList.toggle('hidden');
            title.innerText = loginForm.classList.contains('hidden') ? 'Join the Academy' : 'Decrypting Knowledge';
        }

        /* === API BASE === */
        const API = 'http://localhost:3000/api';

        /* === LOGIN === */
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            btn.disabled = true; btn.textContent = 'Đang xử lý...';
            errEl.style.display = 'none';
            errEl.style.color = '#ef4444'; // Đảm bảo reset lại màu đỏ cho lỗi

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!data.success) {
                    errEl.textContent = data.message;
                    errEl.style.display = 'block';
                } else {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    // Sử dụng replace để xóa trang đăng nhập khỏi lịch sử Back của trình duyệt
                    window.location.replace(data.user.role_id === 1 ? 'admin.html' : 'index.html');
                }
            } catch {
                errEl.textContent = 'Không kết nối được server. Vui lòng thử lại.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'Access System';
            }
        });

        /* === REGISTER === */
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            const errEl = document.getElementById('reg-error');
            const btn = document.getElementById('reg-btn');

            errEl.style.display = 'none';

            if (password !== confirm) {
                errEl.textContent = 'Mật khẩu xác nhận không khớp!';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true; btn.textContent = 'Đang xử lý...';

            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('reg-username').value.trim(),
                        full_name: name,
                        email,
                        password
                    })
                });
                const data = await res.json();

                if (!data.success) {
                    errEl.textContent = data.message;
                    errEl.style.display = 'block';
                } else {
                    // Xóa form đăng ký
                    document.getElementById('signup-form').reset();

                    // Chuyển sang form đăng nhập
                    toggleForm();

                    // Hiện thông báo đăng ký thành công màu xanh
                    const loginErr = document.getElementById('login-error');
                    loginErr.style.color = '#10b981'; // Xanh lá
                    loginErr.textContent = 'Đăng ký thành công! Vui lòng đăng nhập.';
                    loginErr.style.display = 'block';
                }
            } catch {
                errEl.textContent = 'Không kết nối được server. Vui lòng thử lại.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'Begin Journey';
            }
        });

        /* === MẮT NHÌN THEO CHUỘT === */
        const lampEl = document.getElementById('lamp');
        const pupilLeft = document.getElementById('pupil-left');
        const pupilRight = document.getElementById('pupil-right');

        document.addEventListener('mousemove', (e) => {
            [pupilLeft, pupilRight].forEach(pupil => {
                const eye = pupil.parentElement;
                const rect = eye.getBoundingClientRect();
                const dx = e.clientX - (rect.left + rect.width / 2);
                const dy = e.clientY - (rect.top + rect.height / 2);
                const angle = Math.atan2(dy, dx);
                const dist = Math.min(Math.hypot(dx, dy), 5);
                pupil.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;
            });
        });

        /* === NHẮM MẮT TỰ ĐỘNG === */
        function scheduleBlink() {
            setTimeout(() => {
                lampEl.classList.add('blinking');
                setTimeout(() => { lampEl.classList.remove('blinking'); scheduleBlink(); }, 150);
            }, 2500 + Math.random() * 3500);
        }
        scheduleBlink();
    </script>
</body>
