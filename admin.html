<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CODE E-LEARNING PHANTOM</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="Public/Css/Admin/AdminDS.css">
    <link rel="stylesheet" href="Public/Css/Admin/AdminQLND.css">
    <link rel="stylesheet" href="Public/Css/Admin/AdminThemKH.css">
    <link rel="stylesheet" href="Public/Css/Admin/AdminThemVD.css">

    <script>
        /* === ADMIN GUARD - Chạy ngay lập tức, trước khi render trang === */
        (function () {
            const raw  = localStorage.getItem('currentUser');
            const token = localStorage.getItem('token');

            if (!raw || !token) {
                // Chưa đăng nhập → về trang đăng nhập
                window.location.replace('login-register.html');
                return;
            }

            const user = JSON.parse(raw);

            // role_id !== 1 → không phải Admin → về trang user
            if (user.role_id !== 1) {
                window.location.replace('index.html');
            }
        })();
    </script>
</head>
<body>
    <!-- HEADER DYNAMIC -->
    <div class="admin-header">
        <div class="brand-logo">
            <img src="Public/images/logo_phantom.png" alt="Logo" class="logo-img">
            <div class="brand-text">
                <span class="t-purple">CODE E-LEARNING</span>
                <span class="t-black">PHANTOM</span>
            </div>
        </div>
        <div class="header-right">
            <div class="user-profile">
                <span>👤</span>
                <span id="admin-username">Admin</span>
            </div>
            <button class="btn-logout" id="admin-logout-btn">Đăng xuất</button>
        </div>
    </div>

    <div class="admin-layout">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="panel-title">ADMIN PANEL</div>
            <div class="panel-desc">Quản lý Code E-learning Phantom</div>
            
            <div class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="danh-sach-kh.html">
                    📋 Danh sách khóa học
                </a>
                <a href="#" class="nav-item" data-page="them-kh.html">
                    ➕ Thêm khóa học
                </a>
                <a href="#" class="nav-item" data-page="vip-danh-sach.html">
                    👑 Quản lý Khóa học VIP
                </a>
                <a href="#" class="nav-item" data-page="them-vd.html">
                    📹 Thêm bài học / Video
                </a>
                <a href="#" class="nav-item" data-page="AdminQLND.html">
                    👥 Quản lý Người dùng
                </a>
                <a href="#" class="nav-item" data-page="don-hang.html">
                    💰 Quản lý Đơn hàng &amp; Thanh toán
                </a>
            </div>
        </div>

        <!-- NỘI DUNG ĐỘNG -->
        <div class="main-content">
            <div id="dynamic-content" class="content-wrapper">
                <!-- Nội dung sẽ được load vào đây -->
            </div>
        </div>
    </div>

    <script src="Public/JS/main.js"></script>
    <script>
        /* === KHỞI TẠO HEADER ADMIN === */
        (function () {
            const raw  = localStorage.getItem('currentUser');
            if (!raw) return;
            const user = JSON.parse(raw);

            // Hiển thị tên admin thật
            const nameEl = document.getElementById('admin-username');
            if (nameEl) nameEl.textContent = user.full_name || user.username || 'Admin';

            // Xử lý nút đăng xuất
            const logoutBtn = document.getElementById('admin-logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    if (window.showConfirmDialog) {
                        window.showConfirmDialog({
                            title: 'Đăng xuất',
                            message: 'Bạn có chắc chắn muốn rời khỏi hệ thống?',
                            icon: 'fa-right-from-bracket',
                            confirmText: 'Đăng xuất',
                            onConfirm: async () => {
                                try { await fetch('http://localhost:3000/api/auth/logout', { method: 'POST' }); } catch {}
                                localStorage.removeItem('token');
                                localStorage.removeItem('currentUser');
                                window.location.replace('login-register.html');
                            }
                        });
                    } else {
                        if (!confirm('Bạn có chắc chắn muốn đăng xuất?')) return;
                        localStorage.removeItem('token');
                        localStorage.removeItem('currentUser');
                        window.location.replace('login-register.html');
                    }
                });
            }
        })();
    </script>
</body>
</html>
